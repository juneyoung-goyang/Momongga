<style>
  /* Figma Make 디자인 토큰: 숫자 폭 고정 */
  :root { font-variant-numeric: tabular-nums; }
  :root {
    --bg: #FFFFFF; --subtle: #F4F7FB; --line: #E2E8F0;
    --ink: #24364E; --sub: #64748B; --weak: #94A3B8;
    --accent: #3182F6; --accent-press: #1B64DA; --accent-soft: #EEF5FF;

  }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, "Noto Sans KR", system-ui, sans-serif;
    letter-spacing: -0.012em;
    line-height: 1.6;
    word-break: keep-all;
  }
  h1, h2, h3, .tight { letter-spacing: -0.028em; }
  .tnum { font-variant-numeric: tabular-nums; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  button:focus-visible, a:focus-visible { outline: 3px solid #5498F8; outline-offset: 2px; }
  .lucide { stroke-width: 1.75; }
  button { transition: transform 200ms var(--ease), background-color 200ms var(--ease), color 200ms var(--ease); }
  button:not(:disabled):active { transform: scale(.97); }
  /* 새 주문 타일은 한 번만 200ms 동안 나타나요 (깜빡임·발광 없음) */
  @keyframes tileIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tile-in { animation: tileIn 200ms var(--ease) both; }
  .rail-btn[aria-selected="true"] .rail-mark { opacity: 1; }
  .rail-mark { opacity: 0; }

  /* 카드가 다음 칸으로 이동했을 때 */

  /* 새 주문 도착 */

  /* 매출 증가 표시 */
  @keyframes deltaUp { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
  .delta { animation: deltaUp 1.9s ease-out forwards; }

  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .bar-grow { transform-origin: bottom; animation: grow 280ms var(--ease) both; }

  .switch-knob { transition: left 220ms var(--ease); }
  .progress-fill { transition: width 0.8s linear, background-color 0.3s ease; }

  .board { opacity: 0; pointer-events: none; transition: opacity 240ms var(--ease); }
  .board.open { opacity: 1; pointer-events: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }

</style>

<script>
/* =====================================================================
   설정
   ===================================================================== */
const CONFIG = {
  ORDER_PREFIX: 'A-',               // 화면 표기용 접두사 (DB에는 숫자만 저장)
  FIRST_ORDER_NUMBER: 102,          // 시연 데이터 다음 주문번호 (키오스크 첫 주문 #102와 맞춤)
  DEMO_START: '12:20',              // 초기화 시 데모 시계 시작 시각
  POS_VERSION: '3',            // 메뉴가 바뀌면 올려서 시연 데이터를 새로 만듦
  USE_SERVER_API: false,            // 서블릿 연동 시 true
  API_BASE: './api',
  KEYS: {
    orders: 'smartorder.orders',
    soldOut: 'smartorder.soldout',
    seq: 'smartorder.seq',
    version: 'smartorder.pos.version',
    demoOffset: 'smartorder.pos.demoOffset'
  }
};

/* menus 테이블과 동일 (키오스크와 같은 색 톤) */
/* 메뉴는 관리자 프로그램에서 바꾼 값을 공통 저장소(shared/store.js)에서 읽어요 */
function loadMenus() {
  return Store.getMenus().map(function (m) { return Object.assign({}, m, { estimated_cook_time: m.cook, img: m.image }); });
}
let MENUS = loadMenus();

/* 키오스크 상단 AI 위젯과 같은 값 (congestion 테이블 최신 레코드) */
/* AI 대기 예측: 학생 앱과 같은 계산(shared/store.js의 predict) */
function liveAI() {
  const p = Store.predict();
  return {
    currentWait: p.currentWait, level: p.level,
    levelEmoji: p.level === '혼잡' ? '🔴' : p.level === '보통' ? '🟡' : '🟢',
    recTime: p.recTime || '-', recWait: p.recWait || '-', recEmoji: '🟢',
    timeline: p.timeline.map(function (x) {
      const m = Store.toMinutes(x.t);
      return { t: x.t, w: x.w, now: p.nowMinute >= m && p.nowMinute < m + 10, rec: x.t === p.recTime };
    })
  };
}
let AI = liveAI();


const SUB_TABS = [
  { id: 'live',    label: '실시간 주문',   icon: 'layout-grid' },
  { id: 'menu',    label: '메뉴·품절 관리', icon: 'utensils-crossed' },
  { id: 'sales',   label: '매출·혼잡도',   icon: 'chart-column' },
  { id: 'history', label: '완료 내역',     icon: 'history' }
];

const state = {
  restaurant: 'all',     // 식당 필터: 각 식당 직원이 자기 주문만 보기
  orders: [],
  soldOut: {},
  view: 'live',
  demoOffsetMs: 0,
  lastOrdersRaw: null,
  lastSoldOutRaw: '__init__',
  storageOK: true,
  sound: true,
  motion: {},           // { order_number: 'move' | 'new' } 다음 렌더에서 한 번만 애니메이션
  prevRevenue: null,
  boardOpen: false,
  audioCtx: null,
  toastTimer: null,
  numberTimers: {}
};

/* =====================================================================
   공통 유틸
   ===================================================================== */
const MIN = 60000;
function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function comma(n) { return Math.round(n).toLocaleString('ko-KR'); }
function pad2(n) { return String(n).padStart(2, '0'); }
function hhmm(ts) { const d = new Date(ts); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function hhmmss(ts) { const d = new Date(ts); return hhmm(ts) + ':' + pad2(d.getSeconds()); }
function orderNo(n) { return CONFIG.ORDER_PREFIX + String(n).padStart(3, '0'); }
function menuByName(name) { return MENUS.find(function (m) { return m.name === name; }); }
function refreshIcons() { if (window.lucide) { window.lucide.createIcons(); } }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function demoNow() { return Date.now() + state.demoOffsetMs; }
function minutesSince(ts) { return Math.max(0, Math.floor((demoNow() - ts) / MIN)); }
function qtyOf(o) { return o.items.reduce(function (s, i) { return s + i.quantity; }, 0); }
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}

function toast(message) {
  const el = document.getElementById('toast');
  document.getElementById('toastText').textContent = message;
  el.classList.remove('opacity-0', '-translate-y-3');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function () { el.classList.add('opacity-0', '-translate-y-3'); }, 2400);
}

/* =====================================================================
   저장소 (localStorage로 키오스크와 연동, 서버 연동 시 fetch로 대체)
   ===================================================================== */
function readRaw(key) { try { return localStorage.getItem(key); } catch (e) { state.storageOK = false; return null; } }
function writeRaw(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { state.storageOK = false; return false; } }
function removeKey(key) { try { localStorage.removeItem(key); } catch (e) { state.storageOK = false; } }

function saveOrders() {
  const raw = JSON.stringify(state.orders);
  state.lastOrdersRaw = raw;
  writeRaw(CONFIG.KEYS.orders, raw);
}
function saveSoldOut() {
  const raw = JSON.stringify(state.soldOut);
  state.lastSoldOutRaw = raw;
  writeRaw(CONFIG.KEYS.soldOut, raw);
}
function saveOffset() { writeRaw(CONFIG.KEYS.demoOffset, String(state.demoOffsetMs)); }

function issueOrderNumber() {
  let seq = CONFIG.FIRST_ORDER_NUMBER;
  const stored = parseInt(readRaw(CONFIG.KEYS.seq), 10);
  if (!isNaN(stored)) { seq = Math.max(stored, CONFIG.FIRST_ORDER_NUMBER); }
  const maxExisting = state.orders.reduce(function (m, o) { return Math.max(m, o.order_number); }, 0);
  seq = Math.max(seq, maxExisting + 1);
  writeRaw(CONFIG.KEYS.seq, String(seq + 1));
  return seq;
}

async function callApi(path, body) {
  if (!CONFIG.USE_SERVER_API || location.protocol.indexOf('http') !== 0) { return; }
  try {
    await fetch(CONFIG.API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(body) });
  } catch (e) { console.error('서버 동기화 실패:', path, e); }
}

/* =====================================================================
   시연 데이터: 16건 / 99,000원 / 모바일 9 · 키오스크 7 / 접수 2 · 조리 2 · 준비 완료 2
   ===================================================================== */
function demoStartOffset() {
  const parts = CONFIG.DEMO_START.split(':');
  const target = new Date();
  target.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
  return target.getTime() - Date.now();
}

function item(name, qty) {
  const m = menuByName(name);
  return { menu_id: m.menu_id, menu_name: m.name, quantity: qty, unit_price: m.price, total_price: m.price * qty };
}

function makeOrder(no, channel, items, status, ago, extra) {
  const now = demoNow();
  const orderTime = now - ago * MIN;
  const cookMin = expectedCookMinutes({ items: items });
  const o = {
    order_number: no,
    items: items,

    order_status: status,
    order_time: orderTime,
    channel: channel,
    payment_method: channel === '모바일' ? pick(['토스페이', '카카오페이']) : pick(['신용·체크카드', '학생증']),
    pickup_type: 'NOW',
    pos_ingested: true
  };
  if (status !== 'WAITING' && status !== 'CANCELED') { o.cook_started_at = orderTime + 2 * MIN; }
  if (status === 'READY' || status === 'PICKED_UP') { o.ready_at = o.cook_started_at + cookMin * MIN; }
  if (status === 'PICKED_UP') { o.picked_at = o.ready_at + 2 * MIN; }
  if (status === 'CANCELED') { o.canceled_at = orderTime + 1 * MIN; }
  return Object.assign(o, extra || {});
}

/* =====================================================================
   키오스크·학생 주문 수신 / 품절 수신
   ===================================================================== */
function normalize(o) {
  let changed = false;
  if (o.order_status === 'COMPLETED') { o.order_status = 'READY'; o.ready_at = o.ready_at || o.completed_at || demoNow(); changed = true; }
  if (!o.pos_ingested) {
    o.order_time = demoNow();          // 키오스크 실제 시각을 데모 시계 기준으로 맞춤
    o.pos_ingested = true;
    o.channel = o.channel || '키오스크';
    changed = true;
  }
  return changed;
}

function syncOrders() {
  if (!state.storageOK) { return; }
  const raw = readRaw(CONFIG.KEYS.orders);
  if (raw === state.lastOrdersRaw) { return; }
  let incoming = [];
  try { incoming = raw ? JSON.parse(raw) : []; } catch (e) { incoming = []; }
  const known = {};
  state.orders.forEach(function (o) { known[o.order_number] = true; });
  const firstLoad = state.lastOrdersRaw === null;
  let changed = false;
  incoming.forEach(function (o) { if (normalize(o)) { changed = true; } });
  const fresh = incoming.filter(function (o) { return !known[o.order_number]; });
  state.orders = incoming;
  state.lastOrdersRaw = raw;
  if (changed) { saveOrders(); }
  if (!firstLoad && fresh.length) {
    fresh.forEach(function (o) { state.motion[o.order_number] = 'new'; });
    const f = fresh[0];
    toast('새 주문 ' + orderNo(f.order_number) + ' (' + f.channel + ', ' + f.items.map(function (i) { return i.menu_name + ' ' + i.quantity; }).join(', ') + ')');
    beep();
  }
  renderAll();
}

/* =====================================================================
   알림음 / 음성 호출
   ===================================================================== */
function beep() {
  if (!state.sound) { return; }
  try {
    if (!state.audioCtx) { state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    const ctx = state.audioCtx;
    [880, 1320].forEach(function (f, i) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t = ctx.currentTime + i * 0.16;
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.17);
    });
  } catch (e) { /* 소리 차단 환경 */ }
}

function speak(text) {
  if (!state.sound || !('speechSynthesis' in window)) { return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
  } catch (e) { /* 음성 합성 미지원 */ }
}

function toggleSound() {
  state.sound = !state.sound;
  const btn = document.getElementById('soundBtn');
  btn.setAttribute('aria-label', state.sound ? '알림음 끄기' : '알림음 켜기');
  btn.innerHTML = '<i data-lucide="' + (state.sound ? 'volume-2' : 'volume-x') + '" class="w-5 h-5 ' + (state.sound ? 'text-slate-600' : 'text-slate-400') + '"></i>';
  refreshIcons();
  toast(state.sound ? '알림음을 켰어요' : '알림음을 껐어요');
  if (state.sound) { beep(); }
}

function makeSampleOrder(atTime) {
  const pool = MENUS.filter(function (m) { return state.soldOut[m.menu_id] !== true && m.restaurantOpen !== false && m.visible !== false; });
  if (!pool.length) { return null; }
  const count = Math.min(pool.length, Math.random() < 0.65 ? 1 : 2);
  const chosen = pool.slice().sort(function () { return Math.random() - 0.5; }).slice(0, count);
  const items = chosen.map(function (m) { return item(m.name, Math.random() < 0.8 ? 1 : 2); });
  const channel = Math.random() < 0.55 ? '모바일' : '키오스크';
  return {
    order_number: issueOrderNumber(),
    items: items,
    total_price: items.reduce(function (s, i) { return s + i.total_price; }, 0),
    order_status: 'WAITING',
    order_time: atTime,
    channel: channel,
    payment_method: channel === '모바일' ? pick(['토스페이', '카카오페이']) : pick(['신용·체크카드', '학생증']),
    pickup_type: 'NOW',
    pos_ingested: true
  };
}

function addSampleOrder() {
  const o = makeSampleOrder(demoNow());
  if (!o) { toast('판매 중인 메뉴가 없어 주문을 만들 수 없어요'); return; }
  state.orders.push(o);
  state.motion[o.order_number] = 'new';
  saveOrders();
  if (state.view !== 'live') { state.view = 'live'; }
  renderAll();
  beep();
  toast('새 주문 ' + orderNo(o.order_number) + ' 접수 (' + o.channel + ', ' + won(o.total_price) + ')');
}

function fastForward() {
  state.demoOffsetMs += 15 * MIN;
  saveOffset();
  const now = demoNow();
  const snapshot = state.orders.map(function (o) { return o.order_status; });
  const count = { cook: 0, ready: 0, picked: 0, added: 0 };
  state.orders.forEach(function (o, i) {
    const s = snapshot[i];
    if (s === 'READY') {
      o.order_status = 'PICKED_UP'; o.picked_at = now - randInt(1, 6) * MIN; count.picked += 1; state.motion[o.order_number] = 'move';
    } else if (s === 'COOKING') {
      o.order_status = 'READY'; o.ready_at = now - randInt(1, 5) * MIN; count.ready += 1; state.motion[o.order_number] = 'move';
    } else if (s === 'WAITING') {
      o.order_status = 'COOKING'; o.cook_started_at = now - randInt(1, 3) * MIN; count.cook += 1; state.motion[o.order_number] = 'move';
    }
  });
  [9, 3].forEach(function (ago) {
    const o = makeSampleOrder(now - ago * MIN);
    if (o) { state.orders.push(o); state.motion[o.order_number] = 'new'; count.added += 1; }
  });
  saveOrders();
  renderAll();
  if (count.ready) { speak('준비 완료된 주문이 ' + count.ready + '건 있습니다.'); }
  toast('15분이 지났어요. 조리 시작 ' + count.cook + ', 준비 완료 ' + count.ready + ', 수령 ' + count.picked + ', 새 주문 ' + count.added + '건');
}

/* =====================================================================
   계산
   ===================================================================== */
function expectedCookMinutes(o) {
  const maxCook = Math.max.apply(null, o.items.map(function (i) { const m = menuByName(i.menu_name); return m ? m.estimated_cook_time : 5; }));
  return maxCook + Math.floor((qtyOf(o) - 1) / 2);
}

function byStatus(status) {
  const list = state.orders.filter(function (o) { return o.order_status === status; });
  const key = status === 'READY' ? 'ready_at' : status === 'COOKING' ? 'cook_started_at' : 'order_time';
  return list.sort(function (a, b) { return (a[key] || a.order_time) - (b[key] || b.order_time); });
}

function stats() {
  const valid = state.orders.filter(function (o) { return o.order_status !== 'CANCELED'; });
  const canceled = state.orders.filter(function (o) { return o.order_status === 'CANCELED'; });
  const count = function (s) { return state.orders.filter(function (o) { return o.order_status === s; }).length; };
  return {
    valid: valid,
    total: valid.length,
    mobile: valid.filter(function (o) { return o.channel === '모바일'; }).length,
    kiosk: valid.filter(function (o) { return o.channel !== '모바일'; }).length,
    revenue: valid.reduce(function (s, o) { return s + o.total_price; }, 0),
    canceled: canceled.length,
    waiting: count('WAITING'),
    cooking: count('COOKING'),
    ready: count('READY'),
    picked: count('PICKED_UP')
  };
}

function menuSales() {
  const map = {};
  MENUS.forEach(function (m) { map[m.name] = { qty: 0, revenue: 0 }; });
  state.orders.forEach(function (o) {
    if (o.order_status === 'CANCELED') { return; }
    o.items.forEach(function (i) {
      if (!map[i.menu_name]) { map[i.menu_name] = { qty: 0, revenue: 0 }; }
      map[i.menu_name].qty += i.quantity;
      map[i.menu_name].revenue += i.total_price;
    });
  });
  return map;
}

/* =====================================================================
   렌더링: 핵심 지표 (숫자 카운트 애니메이션)
   ===================================================================== */
function setNumber(id, value) {
  const el = document.getElementById(id);
  const from = Number(el.getAttribute('data-v') || 0);
  el.setAttribute('data-v', String(value));
  cancelAnimationFrame(state.numberTimers[id]);
  if (from === value) { el.textContent = comma(value); return; }
  const start = performance.now();
  const dur = 600;
  const step = function (t) {
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = comma(from + (value - from) * eased);
    if (p < 1) { state.numberTimers[id] = requestAnimationFrame(step); }
  };
  state.numberTimers[id] = requestAnimationFrame(step);
}

  document.getElementById('kpiTotalSub').textContent = '모바일 ' + s.mobile + ' · 키오스크 ' + s.kiosk;

    '<span class="h-8 px-3 rounded-full bg-subtle text-[12px] font-bold flex items-center gap-1.5 whitespace-nowrap ' + txt + '"><span class="w-2 h-2 rounded-full ' + tone + '"></span>혼잡도 ' + AI.level + ' · 대기 <span class="tnum">' + AI.currentWait + '분</span></span>';
}

function setView(id) {
  state.view = id;
  renderAll();
  window.scrollTo({ top: document.getElementById('subTabs').getBoundingClientRect().top + window.scrollY - 96, behavior: 'smooth' });
}

/* =====================================================================
   렌더링: 실시간 주문 칸반
   ===================================================================== */
function channelBadge(channel) {
  const mobile = channel === '모바일';
  return '<span class="inline-flex items-center gap-1 h-[22px] px-2 rounded-full text-[11px] font-bold whitespace-nowrap ' +
    (mobile ? 'bg-accent-soft text-accent-press' : 'bg-subtle text-sub') + '">' +
    '<i data-lucide="' + (mobile ? 'smartphone' : 'monitor') + '" class="w-3 h-3"></i>' + (mobile ? '모바일' : '키오스크') + '</span>';
}

function itemsList(o) {
  return '<ul class="mt-3 space-y-2">' + o.items.map(function (i) {
    const m = menuByName(i.menu_name);
    return '<li class="flex items-center gap-2.5">' +
      '<span class="relative w-10 h-10 rounded-[10px] overflow-hidden flex items-center justify-center text-[18px] shrink-0" style="background: ' + (m ? m.tone[0] : '#F4F7FB') + '">' + (m ? m.emoji : '🍽️') +
        (m && m.img ? '<img src="' + m.img + '" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">' : '') + '</span>' +
      '<span class="flex-1 min-w-0"><span class="block text-[15px] font-bold leading-tight truncate">' + i.menu_name + '</span>' +
        (m ? '<span class="block text-[12px] font-medium text-sub truncate">' + m.restaurantName + '</span>' : '') + '</span>' +
      '<span class="text-[16px] font-extrabold tnum">×' + i.quantity + '</span></li>';
  }).join('') + '</ul>';
}

function orderCard(o) {
  const reserved = o.pickup_type === 'RESERVED'
    ? '<span class="inline-flex items-center gap-1 h-[22px] px-2 rounded-full text-[11px] font-bold bg-ink text-white whitespace-nowrap"><i data-lucide="clock" class="w-3 h-3"></i>' + (o.pickup_time || '') + ' 예약</span>'
    : '';
  const btn = 'h-12 rounded-row text-[15px] font-bold flex items-center justify-center gap-1.5 transition';
  const ghost = 'w-12 h-12 shrink-0 rounded-row bg-subtle flex items-center justify-center transition';

  let meta;
  let middle = '';
  let actions;
  if (o.order_status === 'WAITING') {
    meta = '<span class="tnum">' + hhmm(o.order_time) + ' 접수</span><span class="text-weak">·</span><span data-elapsed="' + o.order_time + '" data-warn="7" class="tnum font-bold">방금</span>';
    actions = '<div class="mt-3 flex gap-2">' +
      '<button onclick="startCooking(' + o.order_number + ')" class="flex-1 ' + btn + ' bg-ink hover:bg-[#333D4B] text-white">접수하고 조리 시작<i data-lucide="arrow-right" class="w-4 h-4"></i></button>' +
      '<button onclick="cancelOrder(' + o.order_number + ')" class="' + ghost + ' text-sub hover:text-bad" aria-label="' + orderNo(o.order_number) + ' 주문 취소"><i data-lucide="trash-2" class="w-[18px] h-[18px]"></i></button>' +
    '</div>';
  } else if (o.order_status === 'COOKING') {
    const dur = expectedCookMinutes(o) * MIN;
    meta = '<span class="tnum">' + hhmm(o.order_time) + ' 접수</span><span class="text-weak">·</span><span data-elapsed="' + o.order_time + '" data-warn="15" class="tnum font-bold">방금</span>';
    middle = '<div class="mt-3">' +
      '<div class="h-1.5 rounded-full bg-subtle overflow-hidden"><div class="progress-fill h-full rounded-full bg-accent" style="width:2%" data-cook-start="' + o.cook_started_at + '" data-cook-dur="' + dur + '"></div></div>' +
      '<p class="mt-1.5 text-[12px] text-slate-500 tnum" data-cook-label>목표 ' + expectedCookMinutes(o) + '분</p></div>';
    actions = '<button onclick="markReady(' + o.order_number + ')" class="mt-3 w-full ' + btn + ' bg-ink hover:bg-[#333D4B] text-white">준비 완료·픽업 알림<i data-lucide="arrow-right" class="w-4 h-4"></i></button>';
  } else {
    meta = '<span class="tnum">' + hhmm(o.ready_at || o.order_time) + ' 준비 완료</span><span class="text-weak">·</span><span data-elapsed="' + (o.ready_at || o.order_time) + '" data-warn="10" data-suffix="대기" class="tnum font-bold">방금</span>';
    actions = '<div class="mt-3 flex gap-2">' +
      '<button onclick="markPickedUp(' + o.order_number + ')" class="flex-1 ' + btn + ' bg-accent hover:bg-accent-press text-white">수령 완료 처리<i data-lucide="check" class="w-4 h-4"></i></button>' +
      '<button onclick="recall(' + o.order_number + ')" class="' + ghost + ' text-sub hover:text-accent" aria-label="' + orderNo(o.order_number) + ' 다시 호출"><i data-lucide="megaphone" class="w-[18px] h-[18px]"></i></button>' +
    '</div>';
  }

  return '<article class="order-tile aspect-square flex flex-col rounded-card bg-white shadow-card p-4' + (state.motion[o.order_number] === 'new' ? ' tile-in' : '') + '">' +
    '<div class="flex items-start justify-between gap-2">' +
      '<h4 class="text-[28px] font-extrabold tight leading-none tnum">' + orderNo(o.order_number) + '</h4>' +
      '<p class="text-[14px] font-bold tnum text-sub shrink-0 pt-1">' + won(o.total_price) + '</p>' +
    '</div>' +
    '<div class="mt-2 flex items-center gap-1.5 flex-wrap">' + channelBadge(o.channel) + reserved + '</div>' +
    '<p class="mt-2 text-[12px] font-medium text-sub flex items-center gap-1.5">' + meta + '</p>' +
    '<div class="flex-1 min-h-0 overflow-y-auto no-scrollbar">' + itemsList(o) + '</div>' + middle + actions +
  '</article>';
}

function emptyColumn(status) {
  const text = {
    WAITING: '새 주문이 들어오면 여기에 나타나요. 아래 샘플 주문 추가로 체험해 보세요.',
    COOKING: '조리 중인 주문이 없어요. 접수 카드에서 조리를 시작하세요.',
    READY: '픽업을 기다리는 주문이 없어요.'
  }[status];
  return '<div class="rounded-card bg-white/70 px-5 py-10 text-center text-[14px] font-medium text-sub">' + text + '</div>';
}

function orderHasRestaurant(o, rid) {
  return o.items.some(function (i) { const m = menuByName(i.menu_name); return m && m.restaurant === rid; });
}
function setRestaurant(id) { state.restaurant = id; renderAll(); }
function restaurantChips() {
  const active = state.orders.filter(function (o) { return o.order_status === 'WAITING' || o.order_status === 'COOKING' || o.order_status === 'READY'; });
  const chip = function (id, label, n) {
    const on = state.restaurant === id;
    return '<button onclick="setRestaurant(\'' + id + '\')" aria-pressed="' + on + '" class="shrink-0 h-10 px-4 rounded-full text-[14px] font-semibold flex items-center gap-1.5 whitespace-nowrap ' +
      (on ? 'bg-ink text-white' : 'bg-subtle text-sub hover:text-ink') + '">' + label +
      '<span class="' + (on ? 'text-white/60' : 'text-weak') + ' tnum">' + n + '</span></button>';
  };
  return '<div class="mb-4 flex gap-2 overflow-x-auto no-scrollbar pb-1" role="group" aria-label="식당 필터">' +
    chip('all', '전체 식당', active.length) +
    Store.getRestaurants().map(function (r) { return chip(r.id, r.name + (r.open ? '' : ' (휴무)'), active.filter(function (o) { return orderHasRestaurant(o, r.id); }).length); }).join('') +
  '</div>';
}

function renderLive() {
  const cols = [
    { status: 'WAITING', title: '주문 접수', pill: 'bg-accent text-white', bg: 'bg-stage-wait', hint: '확인 후 조리를 시작하세요' },
    { status: 'COOKING', title: '조리 중',   pill: 'bg-warn text-white',   bg: 'bg-stage-cook', hint: '완료되면 픽업 알림을 보내요' },
    { status: 'READY',   title: '준비 완료', pill: 'bg-ok text-white',     bg: 'bg-stage-ready', hint: '수령하면 처리해 주세요' }
  ];
  return restaurantChips() + '<div class="grid grid-cols-1 lg:grid-cols-3 gap-3 items-start">' + cols.map(function (c) {
    const list = byStatus(c.status).filter(function (o) { return state.restaurant === 'all' || orderHasRestaurant(o, state.restaurant); });
    return '<section class="rounded-card ' + c.bg + ' p-3 min-w-0">' +
      '<header class="px-1.5 pt-1 pb-3 flex items-center gap-2">' +
        '<h3 class="text-[17px] font-extrabold">' + c.title + '</h3>' +
        '<span class="min-w-[26px] h-[22px] px-2 rounded-full text-[12px] font-bold flex items-center justify-center tnum ' + c.pill + '" aria-label="' + list.length + '건">' + list.length + '</span>' +
        '<span class="ml-auto text-[12px] font-medium text-sub hidden xl:inline">' + c.hint + '</span>' +
      '</header>' +
      '<div class="space-y-3">' + (list.length ? list.map(orderCard).join('') : emptyColumn(c.status)) + '</div>' +
    '</section>';
  }).join('') + '</div>';
}

/* =====================================================================
   렌더링: 메뉴·품절 관리
   ===================================================================== */
function renderMenuView() {
  const sales = menuSales();
  const soldOutCount = MENUS.filter(function (m) { return state.soldOut[m.menu_id] === true; }).length;
  const head = '<div class="mb-4 flex flex-wrap items-center gap-3">' +
    '<p class="text-[18px] font-extrabold">판매 중 <span class="text-accent tnum">' + (MENUS.length - soldOutCount) + '개</span>, 품절 <span class="tnum ' + (soldOutCount ? 'text-bad' : 'text-weak') + '">' + soldOutCount + '개</span></p>' +
    '<p class="ml-auto text-[13px] font-medium text-sub flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-ok"></span>스위치를 바꾸면 키오스크와 학생 주문 화면에 바로 반영돼요</p></div>';
  return head + '<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">' + MENUS.map(function (m) {
    const on = state.soldOut[m.menu_id] !== true;
    const s = sales[m.name] || { qty: 0, revenue: 0 };
    return '<article class="rounded-card bg-white border border-line p-3 grid grid-cols-[72px_1fr_auto] gap-3 items-center">' +
      '<div class="relative w-[72px] h-[72px] rounded-row overflow-hidden flex items-center justify-center text-[32px] ' + (on ? '' : 'grayscale opacity-50') + '" style="background:' + m.tone[0] + '">' + m.emoji +
        (m.img ? '<img src="' + m.img + '" alt="' + m.name + '" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">' : '') +
      '</div>' +
      '<div class="min-w-0">' +
        '<p class="text-[11px] font-bold text-sub">' + m.category + (on ? '' : ' · <span class="text-bad">품절 표시 중</span>') + '</p>' +
        '<h3 class="text-[16px] font-bold leading-snug truncate ' + (on ? '' : 'text-weak') + '">' + m.name + '</h3>' +
        '<p class="text-[12px] font-medium text-sub tnum">' + won(m.price) + ', 조리 ' + m.estimated_cook_time + '분</p>' +
        '<p class="mt-1 text-[12px] font-medium text-sub tnum">오늘 판매 <b class="text-ink">' + s.qty + '개</b> · 매출 <b class="text-ink">' + won(s.revenue) + '</b></p>' +
      '</div>' +
      '<div class="flex flex-col items-center gap-1 shrink-0 self-start pt-1">' +
        '<button role="switch" aria-checked="' + on + '" aria-label="' + m.name + ' 판매 상태" onclick="toggleSoldOut(' + m.menu_id + ')" class="relative w-[52px] h-8 rounded-full transition-colors ' + (on ? 'bg-accent' : 'bg-[#D1D6DB]') + '">' +
          '<span class="switch-knob absolute top-1 w-6 h-6 rounded-full bg-white shadow" style="left:' + (on ? '24px' : '4px') + '"></span></button>' +
        '<span class="text-[11px] font-bold ' + (on ? 'text-accent' : 'text-sub') + '">' + (on ? '판매중' : '품절') + '</span>' +
      '</div>' +
    '</article>';
  }).join('') + '</div>';
}

function toggleSoldOut(id) {
  const m = MENUS.find(function (x) { return x.menu_id === id; });
  const nowSoldOut = state.soldOut[id] !== true;
  if (nowSoldOut) { state.soldOut[id] = true; } else { delete state.soldOut[id]; }
  saveSoldOut();
  renderAll();
  callApi('/menus/' + id + '/soldout', { menu_id: id, is_sold_out: nowSoldOut ? 1 : 0 });
  toast(nowSoldOut ? m.name + ' 품절 처리했어요. 키오스크에 바로 반영돼요' : m.name + ' 판매를 다시 시작했어요');
}

/* =====================================================================
   렌더링: 매출·혼잡도
   ===================================================================== */
function renderSalesView() {
  const s = stats();
  const sales = menuSales();
  const now = demoNow();

  /* 10분 단위 주문 건수 (11:30부터 현재까지) */
  const startDay = new Date(now); startDay.setHours(11, 30, 0, 0);
  const slots = [];
  for (let t = startDay.getTime(); t <= now; t += 10 * MIN) { slots.push({ t: t, n: 0 }); }
  if (!slots.length) { slots.push({ t: now, n: 0 }); }
  s.valid.forEach(function (o) {
    const idx = Math.floor((o.order_time - slots[0].t) / (10 * MIN));
    if (idx >= 0 && idx < slots.length) { slots[idx].n += 1; }
  });
  const recent = slots.slice(-12);
  const maxN = Math.max(1, Math.max.apply(null, recent.map(function (x) { return x.n; })));
  const hourly = recent.map(function (x, i) {
    const h = Math.max(4, Math.round(x.n / maxN * 100));
    const last = i === recent.length - 1;
    return '<div class="flex-1 h-full flex flex-col items-center justify-end gap-1.5">' +
      '<span class="text-[12px] font-bold tnum ' + (x.n ? 'text-ink' : 'text-weak') + '">' + x.n + '</span>' +
      '<div class="w-full flex-1 flex items-end justify-center"><div class="bar-grow w-full max-w-[28px] rounded-[8px] ' + (last ? 'bg-accent' : 'bg-[#E2E8F0]') + '" style="height:' + h + '%;animation-delay:' + (i * 30) + 'ms"></div></div>' +
      '<span class="text-[11px] font-medium text-sub tnum">' + hhmm(x.t) + '</span></div>';
  }).join('');

  const maxRev = Math.max(1, Math.max.apply(null, MENUS.map(function (m) { return (sales[m.name] || { revenue: 0 }).revenue; })));
  const menuBars = MENUS.slice().sort(function (a, b) { return (sales[b.name] || {}).revenue - (sales[a.name] || {}).revenue; }).map(function (m) {
    const r = sales[m.name] || { qty: 0, revenue: 0 };
    return '<li>' +
      '<div class="flex items-center justify-between gap-3 text-[14px]"><span class="font-semibold truncate">' + m.name + '</span><span class="tnum text-sub shrink-0">' + r.qty + '개, <b class="text-ink">' + won(r.revenue) + '</b></span></div>' +
      '<div class="mt-1.5 h-2 rounded-full bg-subtle overflow-hidden"><div class="h-full rounded-full bg-accent" style="width:' + Math.round(r.revenue / maxRev * 100) + '%"></div></div></li>';
  }).join('');

  const mobileRev = s.valid.filter(function (o) { return o.channel === '모바일'; }).reduce(function (a, o) { return a + o.total_price; }, 0);
  const kioskRev = s.revenue - mobileRev;
  const mobilePct = s.total ? Math.round(s.mobile / s.total * 100) : 0;

  const leadList = state.orders.filter(function (o) { return o.ready_at && o.order_status !== 'CANCELED'; });
  const avgLead = leadList.length ? Math.round(leadList.reduce(function (a, o) { return a + (o.ready_at - o.order_time); }, 0) / leadList.length / MIN) : 0;
  const avgTicket = s.total ? s.revenue / s.total : 0;

  const maxW = Math.max.apply(null, AI.timeline.map(function (p) { return p.w; }));
  const aiBars = AI.timeline.map(function (p, i) {
    const h = Math.max(8, Math.round(p.w / maxW * 100));
    const color = p.rec ? 'bg-accent' : p.now ? 'bg-accent/45' : 'bg-[#E2E8F0]';
    const label = p.now ? '지금' : (p.rec || i === 0 || i === AI.timeline.length - 1) ? p.t : '';
    return '<div class="flex-1 h-full flex flex-col items-center justify-end gap-1.5">' +
      '<div class="w-full flex-1 flex items-end justify-center"><div class="bar-grow w-full max-w-[14px] rounded-full ' + color + '" style="height:' + h + '%;animation-delay:' + (i * 35) + 'ms"></div></div>' +
      '<span class="h-4 text-[10px] leading-4 whitespace-nowrap tnum ' + (p.rec ? 'text-accent font-bold' : p.now ? 'text-ink font-bold' : 'text-weak') + '">' + label + '</span></div>';
  }).join('');

  const lvTxt = AI.level === '혼잡' ? 'text-bad' : AI.level === '보통' ? 'text-warn' : 'text-ok';
  const lvDot = AI.level === '혼잡' ? 'bg-bad' : AI.level === '보통' ? 'bg-warn' : 'bg-ok';
  const card = 'rounded-card bg-white border border-line p-6';
  return '<div class="grid grid-cols-1 lg:grid-cols-3 gap-3">' +
    '<article class="lg:col-span-2 ' + card + '">' +
      '<div class="flex items-center justify-between gap-3"><h3 class="text-[18px] font-extrabold">10분 단위 주문 건수</h3><span class="text-[12px] font-medium text-sub">취소 주문 제외, 데모 시계 기준</span></div>' +
      '<div class="mt-6 h-48 flex items-end gap-2">' + hourly + '</div>' +
    '</article>' +

    '<article class="' + card + '">' +
      '<div class="flex items-center gap-2"><i data-lucide="timer" class="w-[18px] h-[18px] text-sub"></i><h3 class="text-[18px] font-extrabold">실시간 대기 현황</h3></div>' +
      '<div class="mt-4 grid grid-cols-3 gap-2 text-center">' +
        '<div class="rounded-row bg-subtle p-3"><p class="text-[11px] font-medium text-sub">현재 대기</p><p class="mt-1 text-[20px] font-extrabold tnum">' + AI.currentWait + '분</p></div>' +
        '<div class="rounded-row bg-subtle p-3"><p class="text-[11px] font-medium text-sub">혼잡도</p><p class="mt-1 text-[20px] font-extrabold flex items-center justify-center gap-1.5 ' + lvTxt + '"><span class="w-2 h-2 rounded-full ' + lvDot + '"></span>' + AI.level + '</p></div>' +
        '<div class="rounded-row bg-subtle p-3"><p class="text-[11px] font-medium text-sub">AI 추천</p><p class="mt-1 text-[15px] font-extrabold leading-tight tnum">' + AI.recTime + '<br><span class="text-ok text-[12px]">대기 ' + AI.recWait + '분</span></p></div>' +
      '</div>' +
      '<div class="mt-5 h-24 flex items-end gap-1">' + aiBars + '</div>' +
      '<p class="mt-3 text-[12px] font-medium text-sub">키오스크에서 ' + AI.recTime + ' 예약 주문을 안내하고 있어요</p>' +
    '</article>' +

    '<article class="' + card + '">' +
      '<h3 class="text-[18px] font-extrabold">메뉴별 매출</h3><ul class="mt-5 space-y-4">' + menuBars + '</ul>' +
    '</article>' +

    '<article class="' + card + '">' +
      '<h3 class="text-[18px] font-extrabold">주문 채널</h3>' +
      '<div class="mt-5 h-2.5 rounded-full bg-subtle overflow-hidden flex"><div class="h-full bg-accent rounded-full" style="width:' + mobilePct + '%"></div></div>' +
      '<div class="mt-4 grid grid-cols-2 gap-2">' +
        '<div class="rounded-row bg-accent-soft p-4"><p class="text-[13px] font-semibold text-accent-press flex items-center gap-1"><i data-lucide="smartphone" class="w-4 h-4"></i>모바일</p><p class="mt-1 text-[22px] font-extrabold tnum">' + s.mobile + '건</p><p class="text-[13px] font-medium text-sub tnum">' + won(mobileRev) + '</p></div>' +
        '<div class="rounded-row bg-subtle p-4"><p class="text-[13px] font-semibold text-sub flex items-center gap-1"><i data-lucide="monitor" class="w-4 h-4"></i>키오스크</p><p class="mt-1 text-[22px] font-extrabold tnum">' + s.kiosk + '건</p><p class="text-[13px] font-medium text-sub tnum">' + won(kioskRev) + '</p></div>' +
      '</div>' +
    '</article>' +

    '<article class="' + card + '">' +
      '<h3 class="text-[18px] font-extrabold">운영 지표</h3>' +
      '<dl class="mt-4 divide-y divide-line text-[15px]">' +
        '<div class="py-3 flex justify-between"><dt class="font-medium text-sub">평균 객단가</dt><dd class="font-bold tnum">' + won(avgTicket) + '</dd></div>' +
        '<div class="py-3 flex justify-between"><dt class="font-medium text-sub">주문부터 준비 완료까지</dt><dd class="font-bold tnum">평균 ' + avgLead + '분</dd></div>' +
        '<div class="py-3 flex justify-between"><dt class="font-medium text-sub">수령 완료</dt><dd class="font-bold tnum">' + s.picked + '건</dd></div>' +
        '<div class="py-3 flex justify-between"><dt class="font-medium text-sub">취소</dt><dd class="font-bold tnum ' + (s.canceled ? 'text-bad' : '') + '">' + s.canceled + '건</dd></div>' +
      '</dl>' +
    '</article>' +
  '</div>';
}

/* =====================================================================
   렌더링: 완료 내역
   ===================================================================== */
function renderHistoryView() {
  const list = state.orders.filter(function (o) { return o.order_status === 'PICKED_UP' || o.order_status === 'CANCELED'; })
    .sort(function (a, b) { return (b.picked_at || b.canceled_at || b.order_time) - (a.picked_at || a.canceled_at || a.order_time); });
  const picked = list.filter(function (o) { return o.order_status === 'PICKED_UP'; }).length;
  const rows = list.map(function (o) {
    const done = o.order_status === 'PICKED_UP';
    const lead = done && o.ready_at ? Math.max(1, Math.round((o.ready_at - o.order_time) / MIN)) + '분' : '-';
    return '<tr class="border-t border-line ' + (done ? '' : 'text-weak') + '">' +
      '<td class="px-6 py-3.5 font-bold tnum whitespace-nowrap">' + orderNo(o.order_number) + '</td>' +
      '<td class="px-3 py-3.5 whitespace-nowrap">' + channelBadge(o.channel) + '</td>' +
      '<td class="px-3 py-3.5 min-w-[200px]">' + o.items.map(function (i) { return i.menu_name + ' ' + i.quantity + '개'; }).join(', ') + '</td>' +
      '<td class="px-3 py-3.5 text-right font-semibold tnum whitespace-nowrap ' + (done ? '' : 'line-through') + '">' + won(o.total_price) + '</td>' +
      '<td class="px-3 py-3.5 tnum whitespace-nowrap">' + hhmm(o.order_time) + '</td>' +
      '<td class="px-3 py-3.5 tnum whitespace-nowrap">' + lead + '</td>' +
      '<td class="px-6 py-3.5 whitespace-nowrap"><span class="inline-flex h-6 px-2.5 rounded-full text-[12px] font-bold items-center ' +
        (done ? 'bg-subtle text-ink' : 'bg-rose-50 text-bad') + '">' + (done ? '수령 완료' : '취소') + '</span></td>' +
    '</tr>';
  }).join('');
  return '<article class="rounded-card bg-white border border-line overflow-hidden">' +
    '<header class="px-6 py-5 flex flex-wrap items-center gap-3">' +
      '<h3 class="text-[18px] font-extrabold">완료 내역</h3>' +
      '<span class="text-[13px] font-medium text-sub">수령 완료 ' + picked + '건, 취소 ' + (list.length - picked) + '건</span>' +
      '<button onclick="exportTrainingCSV()" class="ml-auto h-10 px-4 rounded-full bg-ink text-white text-[13px] font-bold flex items-center gap-1.5"><i data-lucide="download" class="w-4 h-4"></i>AI 학습 데이터 내보내기</button>' +
    '</header>' +
    (list.length
      ? '<div class="overflow-x-auto"><table class="w-full text-[14px]">' +
          '<thead class="bg-subtle text-[12px] text-sub text-left"><tr>' +
            '<th class="px-6 py-3 font-semibold">주문번호</th><th class="px-3 py-3 font-semibold">채널</th><th class="px-3 py-3 font-semibold">메뉴</th>' +
            '<th class="px-3 py-3 font-semibold text-right">금액</th><th class="px-3 py-3 font-semibold">주문 시각</th><th class="px-3 py-3 font-semibold">준비 소요</th><th class="px-6 py-3 font-semibold">상태</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<p class="px-6 pb-10 pt-4 text-center font-medium text-sub">아직 처리한 주문이 없어요. 실시간 주문에서 수령 완료를 처리하면 여기에 쌓여요.</p>') +
  '</article>';
}

/* 주문 기록을 CSV로 저장 → python predict.py --data 파일.csv 로 모델 재학습 */
function exportTrainingCSV() {
  const cfg = Store.getAIConfig();
  const rows = state.orders.filter(function (o) { return o.order_status !== 'CANCELED'; }).sort(function (a, b) { return a.order_time - b.order_time; });
  const head = ['order_number', 'order_minute', 'weekday', 'is_exam', 'is_event', 'is_rain', 'wait_minutes', 'channel', 'items'];
  const lines = rows.map(function (o) {
    const d = new Date(o.order_time);
    const wait = o.ready_at ? Math.round((o.ready_at - o.order_time) / MIN) : '';
    const items = o.items.map(function (i) { return i.menu_name + ' ' + i.quantity; }).join(' / ').replace(/"/g, "'");
    return [o.order_number, d.getHours() * 60 + d.getMinutes(), (d.getDay() + 6) % 7, cfg.examPeriod ? 1 : 0, cfg.campusEvent ? 1 : 0, cfg.rain ? 1 : 0, wait, o.channel, '"' + items + '"'].join(',');
  });
  const csv = '\ufeff' + [head.join(',')].concat(lines).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  const d = new Date(demoNow());
  a.href = URL.createObjectURL(blob);
  a.download = 'mjc_orders_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  toast('주문 ' + rows.length + '건을 저장했어요. python predict.py --data 로 다시 학습해요');
}

/* =====================================================================
   픽업 보드
   ===================================================================== */
function openBoard() {
  state.boardOpen = true;
  renderBoard();
  document.getElementById('board').classList.add('open');
}
function closeBoard() {
  state.boardOpen = false;
  document.getElementById('board').classList.remove('open');
}
function renderBoard() {
  if (!state.boardOpen) { return; }
  const preparing = byStatus('WAITING').concat(byStatus('COOKING')).sort(function (a, b) { return a.order_number - b.order_number; });
  const ready = byStatus('READY');
  document.getElementById('boardBody').innerHTML =
    '<section class="rounded-card bg-subtle p-6 sm:p-8">' +
      '<h3 class="text-[24px] font-extrabold text-sub flex items-center gap-2.5">준비 중 <span class="min-w-[36px] h-8 px-2.5 rounded-full bg-white text-[18px] text-ink flex items-center justify-center tnum">' + preparing.length + '</span></h3>' +
      '<div class="mt-6 grid grid-cols-2 xl:grid-cols-3 gap-3">' + (preparing.length ? preparing.map(function (o) {
        return '<div class="rounded-row bg-white py-6 text-center text-[40px] font-extrabold leading-none tnum text-ink">' + orderNo(o.order_number) + '</div>';
      }).join('') : '<p class="col-span-full text-[18px] font-medium text-sub">준비 중인 주문이 없어요</p>') + '</div>' +
    '</section>' +
    '<section class="rounded-card bg-white border-2 border-ok p-6 sm:p-8">' +
      '<h3 class="text-[24px] font-extrabold text-ok flex items-center gap-2.5"><i data-lucide="package-check" class="w-7 h-7"></i>준비 완료, 픽업해 주세요 <span class="min-w-[36px] h-8 px-2.5 rounded-full bg-ok text-[18px] text-white flex items-center justify-center tnum">' + ready.length + '</span></h3>' +
      '<div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4">' + (ready.length ? ready.map(function (o) {
        return '<div class="rounded-row bg-[#E6F7EE] py-8 text-center"><p class="text-[72px] font-extrabold leading-none tnum tight text-ok">' + orderNo(o.order_number) + '</p>' +
          '<p class="mt-3 text-[16px] font-semibold text-sub">' + o.items.map(function (i) { return i.menu_name; }).join(', ') + '</p></div>';
      }).join('') : '<p class="col-span-full text-[18px] font-medium text-sub">픽업을 기다리는 주문이 없어요</p>') + '</div>' +
    '</section>';
  refreshIcons();
}

/* =====================================================================
   전체 렌더 & 1초 갱신
   ===================================================================== */
function renderAll() {
  MENUS = loadMenus();
  AI = liveAI();
  renderKPIs();
  renderSubTabs();
  renderDate();
  const view = document.getElementById('view');
  if (state.view === 'menu') { view.innerHTML = renderMenuView(); }
  else if (state.view === 'sales') { view.innerHTML = renderSalesView(); }
  else if (state.view === 'history') { view.innerHTML = renderHistoryView(); }
  else { view.innerHTML = renderLive(); }
  state.motion = {};
  renderBoard();
  refreshIcons();
  tick();
}

function tick() {
  const now = demoNow();
  document.getElementById('demoClock').textContent = hhmmss(now);
  document.getElementById('boardClock').textContent = hhmm(now);

  document.querySelectorAll('[data-elapsed]').forEach(function (el) {
    const m = minutesSince(Number(el.getAttribute('data-elapsed')));
    const warn = Number(el.getAttribute('data-warn') || 999);
    const suffix = el.getAttribute('data-suffix') || '경과';
    el.textContent = m < 1 ? '방금' : m + '분 ' + suffix;
    el.classList.toggle('text-rose-500', m >= warn);
  });

  document.querySelectorAll('[data-cook-start]').forEach(function (bar) {
    const start = Number(bar.getAttribute('data-cook-start'));
    const dur = Number(bar.getAttribute('data-cook-dur'));
    const ratio = (now - start) / dur;
    bar.style.width = Math.min(100, Math.max(3, ratio * 100)) + '%';
    bar.style.backgroundColor = ratio > 1 ? '#f43f5e' : '#3182F6';
    const label = bar.parentElement.parentElement.querySelector('[data-cook-label]');
    if (label) {
      const remain = Math.ceil((dur - (now - start)) / MIN);
      label.textContent = remain > 0 ? '목표 ' + Math.round(dur / MIN) + '분, 약 ' + remain + '분 남음' : '목표 시간 ' + Math.abs(remain) + '분 초과';
      label.className = 'mt-1.5 text-[12px] tnum ' + (remain > 0 ? 'text-slate-500' : 'text-rose-500 font-semibold');
    }
  });
}

/* =====================================================================
   초기화
   ===================================================================== */
function init() {
  Store.ensureSeed();
  state.demoOffsetMs = Store.getDemoOffset();
  MENUS = loadMenus();
  state.lastOrdersRaw = null;
  renderGlobalTabs();
  syncOrders();
  syncSoldOut();
  renderAll();

  if (!state.storageOK) {
    const badge = document.getElementById('syncBadge');
    badge.className = 'hidden md:inline-flex items-center gap-1.5 h-8 px-3 rounded-full bg-[#FFF4E6] text-warn text-[12px] font-semibold whitespace-nowrap';
    document.getElementById('syncText').textContent = '이 화면에서만 동작 중';
  }

  setInterval(tick, 1000);
  setInterval(function () { syncOrders(); syncSoldOut(); syncShared(); }, 1500);
  window.addEventListener('storage', function (e) {
    if (e.key === CONFIG.KEYS.orders) { syncOrders(); }
    if (e.key === CONFIG.KEYS.soldOut) { syncSoldOut(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.boardOpen) { closeBoard(); } });
}

/* supabase-sync.js가 서버 데이터를 먼저 받아온 뒤 화면을 시작 (파일이 없으면 바로 시작) */
document.addEventListener('DOMContentLoaded', function () { (window.dbReady || Promise.resolve()).then(init); });
</script>
