<script>
  window.tailwind = window.tailwind || {};
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue:  { 50: '#E8F3FF', 100: '#C9E2FF', 200: '#90C2FF', 300: '#64A8FF', 400: '#5498F8', 500: '#3182F6', 600: '#2272EB', 700: '#1B64DA', 800: '#1957C2', 900: '#194AA6' },
          slate: { 50: '#F9FAFB', 100: '#F2F4F6', 200: '#E5E8EB', 300: '#D1D6DB', 400: '#B0B8C1', 500: '#6B7684', 600: '#4E5968', 700: '#333D4B', 800: '#333D4B', 900: '#191F28' },
          bg: '#FFFFFF', subtle: '#F4F5F7', line: '#EEF0F2',
          ink: '#191F28', sub: '#6B7684', weak: '#A0A7B0',
          accent: { DEFAULT: '#3182F6', press: '#1B64DA', soft: '#E8F3FF' },

        },

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #FFFFFF; --subtle: #F4F5F7; --line: #EEF0F2;
    --ink: #191F28; --sub: #6B7684; --weak: #A0A7B0;
    --accent: #3182F6; --accent-press: #1B64DA; --accent-soft: #E8F3FF;
    --ok: #03B26C; --warn: #FE9800; --bad: #F04452;
    --r-row: 14px; --r-card: 20px; --r-sheet: 28px;
    --shadow: 0 6px 20px rgba(25,31,40,.08);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; letter-spacing: -0.012em; word-break: keep-all; color: var(--ink); }
  h1, h2, h3 { letter-spacing: -0.03em; }
  .tnum { font-variant-numeric: tabular-nums; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .lucide { stroke-width: 1.75; }
  .lucide.sw-bold { stroke-width: 2.25; }
  button, label[role="button"] { transition: transform 200ms var(--ease), background-color 200ms var(--ease), color 200ms var(--ease); }
  button:not(:disabled):active { transform: scale(.97); }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #5498F8; outline-offset: 2px; }
  .sheet { transform: translateY(102%); transition: transform 280ms var(--ease); }
  .sheet.open { transform: translateY(0); }
  .fade { opacity: 0; pointer-events: none; transition: opacity 240ms var(--ease); }
  .fade.open { opacity: 1; pointer-events: auto; }
  .cartbar { transform: translateY(160%); transition: transform 280ms var(--ease); }
  .cartbar.show { transform: translateY(0); }
  @keyframes pop { 0% { transform: scale(0.94); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .pop { animation: pop 260ms var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise 240ms var(--ease) both; }
  /* 화면 첫 렌더에서만 목록이 8px 올라오며 나타나요 (30ms 간격) */
  #view[data-anim="1"] .fu { animation: rise 260ms var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  .card { background: #fff; border-radius: var(--r-card); box-shadow: var(--shadow); }
  /* 왼쪽 분류 레일: 선택한 칸이 오른쪽 목록과 이어지는 홈(notch) */
  .rail { background: var(--subtle); }
  .rail-item { position: relative; }
  .rail-item[aria-current="true"] { background: #fff; border-radius: 14px 0 0 14px; }
  .rail-item[aria-current="true"]::before, .rail-item[aria-current="true"]::after { content: ''; position: absolute; right: 0; width: 14px; height: 14px; pointer-events: none; }
  .rail-item[aria-current="true"]::before { top: -14px; border-bottom-right-radius: 14px; box-shadow: 5px 5px 0 5px #fff; }
  .rail-item[aria-current="true"]::after { bottom: -14px; border-top-right-radius: 14px; box-shadow: 5px -5px 0 5px #fff; }
  .rail-item[aria-current="true"] .rail-mark { opacity: 1; }
  .rail-mark { opacity: 0; }
  .opt input:checked + .opt-face { background: var(--accent); color: #fff; border-color: var(--accent); }
  .opt input:checked + .opt-face .opt-sub { color: rgba(255,255,255,.85); }
  .opt input:focus-visible + .opt-face { outline: 3px solid #5498F8; outline-offset: 2px; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .ring-draw { stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw 0.6s 0.1s ease-out forwards; }
  .tick-draw { stroke-dasharray: 48; stroke-dashoffset: 48; animation: draw 0.35s 0.6s ease-out forwards; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; } .ring-draw, .tick-draw { stroke-dashoffset: 0; } button:not(:disabled):active { transform: none; } }
</style>

<script>
/* =====================================================================
   MJC Table 학생 앱
   ===================================================================== */
const S = window.Store;
const PAY = [
  { id: 'toss', label: '토스페이', icon: 'smartphone' },
  { id: 'kakao', label: '카카오페이', icon: 'smartphone' },
  { id: 'card', label: '신용·체크카드', icon: 'credit-card' },
  { id: 'campus', label: '학생증', icon: 'id-card' }
];
const CHIPS = ['고기 말고 국물 있는 거', '10분 안에 받을 수 있는 메뉴', '오늘 남은 칼로리에 맞춰 줘', '어제랑 다른 거 추천해 줘', '단백질 많은 메뉴'];

const state = {
  tab: 'home', category: '전체', sort: 'fast',
  cart: [], pickup: 'now', pay: 'toss',
  detailId: null, detailQty: 1, detailOpts: { rice: '보통', sauce: false },
  chat: [], chatBusy: false,
  lastRaw: '', knownStatus: {}, toastTimer: null, doneTimer: null,
  server: { ready: false, reason: 'checking' }
};
/* 개발자 설정(키 입력칸)은 주소 끝에 ?dev=1 을 붙였을 때만 보여요. ?dev=0 으로 다시 숨겨요 */
const DEV = (function () {
  const q = new URLSearchParams(location.search).get('dev');
  if (q === '1') { S.writeRaw('smartorder.devMode', '1'); }
  if (q === '0') { S.removeKey('smartorder.devMode'); }
  return S.readRaw('smartorder.devMode') === '1';
})();

/* ---------- 공통 ---------- */
const won = S.won;
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function icons() { if (window.lucide) { window.lucide.createIcons(); } }
function menus() { return S.getMenus().filter(m => m.visible !== false); }
function menu(id) { return S.getMenus().find(m => m.menu_id === Number(id)); }
function hasBatchim(w) { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; }
function josa(w, a, b) { return w + (hasBatchim(w) ? a : b); }
function photo(m, cls) {
  const tone = m.tone || ['#F2F4F6', '#E5E8EB'];
  const ill = `<span class="absolute inset-0 flex items-center justify-center" style="background: ${tone[0]}; container-type: inline-size"><span class="flex items-center justify-center rounded-full bg-white/60" style="width: 64%; aspect-ratio: 1"><span class="leading-none select-none" style="font-size: 34cqw">${m.emoji}</span></span></span>`;
  return `<span class="relative block overflow-hidden bg-slate-100 ${cls}">${ill}${m.image ? `<img src="${m.image}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : ''}</span>`;
}
function restPhoto(r, cls) {
  return photo({ emoji: r.emoji, tone: r.tone, image: r.coverImage }, cls);
}
function toast(text, icon) {
  const el = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('toastIcon').innerHTML = `<i data-lucide="${icon || 'check'}" class="w-4 h-4"></i>`;
  icons();
  el.classList.remove('opacity-0', '-translate-y-3');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => el.classList.add('opacity-0', '-translate-y-3'), 2600);
}
function tag(text, tone) {
  const t = { gray: 'bg-subtle text-sub', blue: 'bg-accent-soft text-accent-press', red: 'bg-[#FDECEE] text-bad', dark: 'bg-ink text-white' }[tone || 'gray'];
  return `<span class="inline-flex items-center h-[22px] px-2 rounded-full text-[11px] font-bold ${t}">${text}</span>`;
}
/* 화면 표시용: 대기 시간 → 상태 색 (원활·보통·혼잡) */
function waitTone(w) { return w <= 10 ? 'ok' : w <= 15 ? 'warn' : 'bad'; }
function levelTone(level) { return level === '혼잡' ? 'bad' : level === '보통' ? 'warn' : 'ok'; }
function waitBadge(w, cls) {
  const c = { ok: 'text-ok', warn: 'text-warn', bad: 'text-bad' }[waitTone(w)];
  return `<span class="inline-flex items-center gap-1 h-6 px-2 rounded-full bg-white text-[12px] font-bold tnum ${c} ${cls || ''}"><i data-lucide="timer" class="w-3.5 h-3.5"></i>${w}분</span>`;
}
function cartQtyOf(test) { return state.cart.filter(l => { const m = menu(l.id); return m && test(m); }).reduce((s, l) => s + l.qty, 0); }

/* ---------- 개인 맞춤 추천 (앱 안에서 바로 계산) ---------- */
function todayPicks() {
  /* 비회원 '오늘의 추천 메뉴': 오늘 많이 팔린 메뉴 + 지금 빨리 나오는 메뉴 (모두에게 같음) */
  const pred = S.predict();
  const sold = {};
  S.getOrders().forEach(o => { if (o.order_status !== 'CANCELED') { o.items.forEach(i => { sold[i.menu_name] = (sold[i.menu_name] || 0) + i.quantity; }); } });
  return menus().filter(m => m.orderable)
    .map(m => ({ m, score: (sold[m.name] || 0) * 3 - S.menuWait(m, pred) / 4 }))
    .sort((a, b) => b.score - a.score).slice(0, 6).map(x => ({ menu: x.m, sold: sold[x.m.name] || 0 }));
}
function personalPick() {
  const p = S.getProfile();
  const intake = S.todayIntake();
  const pred = S.predict();
  const y = p.history.find(h => h.daysAgo === 1);
  const yMenu = y ? menu(y.menu_id) : null;
  let list = menus().filter(m => m.orderable);
  const reasons = [];
  if (yMenu) {
    list = list.filter(m => m.menu_id !== yMenu.menu_id);
    if (yMenu.spicy) { const mild = list.filter(m => !m.spicy); if (mild.length) { list = mild; reasons.push('어제 매운 걸 드셨어요'); } }
  }
  const fit = list.filter(m => m.kcal <= Math.max(500, intake.remain));
  if (fit.length) { list = fit; }
  list.sort((a, b) => S.menuWait(a, pred) - S.menuWait(b, pred) || b.protein - a.protein);
  const pick = list[0];
  if (!pick) { return null; }
  reasons.push(`남은 ${intake.remain.toLocaleString('ko-KR')}kcal 안`);
  reasons.push(`지금 ${S.menuWait(pick, pred)}분`);
  return { menu: pick, reasons, yMenu };
}

/* ---------- 탭바 ---------- */
function renderTabbar() {
  const active = S.myOrders().filter(o => ['WAITING', 'COOKING', 'READY'].includes(o.order_status)).length;
  const tabs = [
    { id: 'home', label: '홈', icon: 'house' },
    { id: 'menu', label: '메뉴', icon: 'utensils' },
    { id: 'ai', label: 'AI 추천', icon: 'sparkles', center: true },
    { id: 'my', label: '마이', icon: 'user', badge: active }
  ];
  document.getElementById('tabbar').innerHTML = tabs.map(t => {
    const on = state.tab === t.id || (t.id === 'home' && state.tab === 'restaurant') || (t.id === 'my' && state.tab === 'orders');
    if (t.center) {
      return `<button onclick="go('${t.id}')" class="flex flex-col items-center justify-center gap-0.5" aria-label="${t.label}" ${on ? 'aria-current="page"' : ''}>
        <span class="w-8 h-8 rounded-xl ${on ? 'bg-blue-700' : 'bg-blue-500'} text-white flex items-center justify-center"><i data-lucide="${t.icon}" class="w-[18px] h-[18px]"></i></span>
        <span class="text-[11px] font-bold ${on ? 'text-blue-700' : 'text-slate-500'}">${t.label}</span></button>`;
    }
    return `<button onclick="go('${t.id}')" class="relative flex flex-col items-center justify-center gap-1" ${on ? 'aria-current="page"' : ''}>
      <i data-lucide="${t.icon}" class="w-[22px] h-[22px] ${on ? 'text-slate-900' : 'text-slate-400'}" stroke-width="${on ? 2.4 : 2}"></i>
      <span class="text-[11px] ${on ? 'font-bold text-slate-900' : 'font-medium text-slate-500'}">${t.label}</span>
      ${t.badge ? `<span class="absolute top-2 left-1/2 ml-2 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">${t.badge}</span>` : ''}</button>`;
  }).join('');
}

function go(tab, opts) {
  state.tab = tab;
  if (opts && opts.category) { state.category = opts.category; }
  if (opts && opts.restaurant) { state.restaurantId = opts.restaurant; }
  render();
  window.scrollTo(0, 0);
  if (tab === 'ai' && opts && opts.ask) { sendChat(opts.ask); }
  if (tab === 'ai') { setTimeout(() => { const i = document.getElementById('chatInput'); if (i && !(opts && opts.ask)) { i.focus({ preventScroll: true }); } }, 200); }
}

/* ---------- 홈 ---------- */
/* 전에 먹은 메뉴: 이 기기의 최근 주문 → (회원이면) 지난 학식 기록 */
function lastMeal() {
  const mine = S.myOrders().filter(o => o.order_status !== 'CANCELED').sort((a, b) => b.order_time - a.order_time);
  if (mine.length) {
    const it = mine[0].items[0];
    const m = menu(it.menu_id) || S.menuByName(it.menu_name);
    if (m) { return { menu: m, when: '최근' }; }
  }
  if (S.isMember()) {
    const h = S.getProfile().history.slice().sort((a, b) => a.daysAgo - b.daysAgo)[0];
    const m = h ? menu(h.menu_id) : null;
    if (m) { return { menu: m, when: h.daysAgo === 1 ? '어제' : h.daysAgo + '일 전' }; }
  }
  return null;
}

function bannerHTML() {
  const p = S.predict();
  const o = S.openState();
  const tone = levelTone(p.level);
  const dot = { ok: 'bg-ok', warn: 'bg-warn', bad: 'bg-bad' }[tone];
  const txt = { ok: 'text-ok', warn: 'text-warn', bad: 'text-bad' }[tone];
  const headline = !o.open ? (o.next ? `${o.next}에 다시 열어요` : '오늘 영업이 끝났어요')
    : p.recTime && p.saving >= 5 ? `${p.recTime}에 오면 ${p.recWait}분이면 받아요`
    : `지금 주문하면 ${p.currentWait}분이면 받아요`;
  const max = Math.max(1, ...p.timeline.map(x => x.w));
  const bars = p.timeline.map(x => {
    const m = S.toMinutes(x.t);
    const isNow = p.nowMinute >= m && p.nowMinute < m + 10;
    const isRec = x.t === p.recTime;
    const hi = isNow || isRec;
    return `<div class="flex-1 min-w-0 flex flex-col items-center justify-end gap-1 relative">
      <div class="w-full max-w-[8px] rounded-full ${isRec ? 'bg-accent' : isNow ? 'bg-accent/45' : 'bg-[#E5E8EB]'}" style="height:${Math.max(10, Math.round(x.w / max * 100))}%"></div>
      ${hi ? `<span class="absolute -bottom-[18px] text-[10px] font-bold whitespace-nowrap ${isRec ? 'text-accent' : 'text-ink'}">${isNow ? '지금' : x.t}</span>` : ''}
    </div>`;
  }).join('');
  const showReserve = o.open && p.recTime && p.saving >= 5;
  const last = lastMeal();
  return `<section aria-label="AI 대기 예측" class="card mx-5 mt-4 p-5 fu" style="--i:1">
    <div class="grid grid-cols-2 gap-3">
      <div class="rounded-row bg-subtle px-3.5 py-3">
        <p class="text-[12px] font-medium text-sub">현재 식당 혼잡도</p>
        <p class="mt-1 text-[22px] leading-[32px] font-extrabold flex items-center gap-2 ${txt}"><span class="w-2.5 h-2.5 rounded-full ${dot}"></span>${p.level}</p>
      </div>
      <div class="rounded-row bg-subtle px-3.5 py-3">
        <p class="text-[12px] font-medium text-sub">AI 예측 대기 시간</p>
        <p class="mt-1 text-[32px] leading-[32px] font-extrabold tnum">${p.currentWait}<span class="text-[16px] font-bold ml-0.5">분</span></p>
      </div>
    </div>
    <div class="mt-5 h-[64px] flex gap-[3px] px-1" role="img" aria-label="시간대별 예상 대기. 지금 ${p.currentWait}분${p.recTime ? ', ' + p.recTime + ' ' + p.recWait + '분' : ''}">${bars}</div>
    <div class="h-[18px]"></div>
    <p class="mt-3 text-[20px] leading-[28px] font-extrabold">${headline}</p>
    ${showReserve || last ? `<div class="mt-4 flex gap-2">
      ${showReserve ? `<button onclick="chooseReserve()" class="flex-1 min-w-0 h-14 px-4 rounded-row bg-accent active:bg-accent-press text-white flex items-center gap-2.5 text-left">
        <i data-lucide="clock" class="w-5 h-5 shrink-0"></i>
        <span class="min-w-0"><span class="block text-[15px] font-bold whitespace-nowrap">${p.recTime} 예약 주문</span><span class="block text-[12px] font-medium text-white/85">${p.saving}분 덜 기다려요</span></span></button>` : ''}
      ${last ? `<button onclick="openDetail(${last.menu.menu_id})" class="${showReserve ? 'w-[148px] shrink-0' : 'flex-1'} h-14 pl-2 pr-3 rounded-row bg-subtle flex items-center gap-2 text-left" aria-label="${last.when} 먹은 메뉴 ${last.menu.name} 다시 보기">
        ${photo(last.menu, 'w-10 h-10 rounded-[10px] shrink-0')}
        <span class="min-w-0"><span class="block text-[11px] text-sub whitespace-nowrap">${last.when} 먹은</span><span class="block text-[13px] font-bold truncate">${last.menu.short}</span></span></button>` : ''}
    </div>` : ''}
    <button onclick="openWhy()" class="mt-3 h-9 -ml-1 px-1 text-[13px] font-semibold text-sub flex items-center gap-1"><i data-lucide="chart-column" class="w-4 h-4"></i>왜 이 시간인가요?<i data-lucide="chevron-right" class="w-4 h-4"></i></button>
  </section>`;
}

function homeCard(m, pred, sold, i) {
  return `<button onclick="openDetail(${m.menu_id})" class="fu shrink-0 w-[140px] text-left" style="--i:${i}">
    <span class="relative block">${photo(m, 'w-[140px] h-[140px] rounded-row')}
      ${waitBadge(S.menuWait(m, pred), 'absolute left-2 bottom-2')}
      ${sold ? `<span class="absolute left-2 top-2 h-6 px-2 rounded-full bg-ink/80 text-white text-[11px] font-bold flex items-center">오늘 ${sold}그릇</span>` : ''}</span>
    <span class="block mt-2.5 text-[15px] font-bold leading-tight truncate">${m.name}</span>
    <span class="block mt-0.5 text-[12px] font-medium text-sub">${m.restaurantName}</span>
    <span class="block mt-1 text-[15px] font-extrabold text-ink tnum">${won(m.price)}</span>
  </button>`;
}

function renderHome() {
  const o = S.openState();
  const pred = S.predict();
  const member = S.isMember();
  const prof = S.getProfile();
  const pick = member ? personalPick() : null;
  const picks = member ? [] : todayPicks();
  const fast = menus().filter(m => m.orderable).sort((a, b) => S.menuWait(a, pred) - S.menuWait(b, pred)).slice(0, 6);
  const rests = S.getRestaurants();
  return `
  <header class="bg-white px-5 pt-[max(14px,env(safe-area-inset-top))]">
    <div class="flex items-center gap-2 h-12">
      <h1 class="text-[24px] font-extrabold truncate">MJC Table</h1>
      <span class="ml-auto shrink-0 h-7 px-2.5 rounded-full text-[12px] font-bold flex items-center gap-1.5 whitespace-nowrap ${o.open ? 'bg-subtle text-ink' : 'bg-[#FDECEE] text-bad'}"><span class="w-1.5 h-1.5 rounded-full ${o.open ? 'bg-ok' : 'bg-bad'}"></span>${o.open ? '영업 중' : o.label}${o.until ? ' ~' + o.until : ''}</span>
    </div>
    <p class="-mt-1 text-[13px] font-medium text-sub flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i>명지전문대 학생식당</p>
    <button onclick="go('ai')" class="mt-3 w-full h-12 rounded-full bg-subtle text-left px-4 flex items-center gap-2.5 text-[15px] font-medium text-weak">
      <i data-lucide="search" class="w-5 h-5 text-sub shrink-0"></i><span class="flex-1 truncate">오늘은 뭐 먹지? "고기 말고 국물"</span>
    </button>
  </header>

  ${bannerHTML()}

  <div class="pt-7">
    <div class="grid grid-cols-5 gap-x-1 gap-y-4 px-3" role="list" aria-label="식당">
      ${rests.map((r, i) => { const q = pred.queues[r.id]; return `<button role="listitem" onclick="go('restaurant', { restaurant: '${r.id}' })" class="fu flex flex-col items-center gap-1 ${r.open ? '' : 'opacity-50'}" style="--i:${i + 2}" aria-label="${r.name}${r.open ? '' : ' (오늘 휴무)'}">
        ${restPhoto(r, 'w-14 h-14 rounded-row')}
        <span class="mt-0.5 text-[12px] font-semibold leading-tight text-ink text-center break-keep">${r.name}</span>
        ${r.open ? (typeof q === 'number' ? `<span class="text-[11px] font-medium text-sub tnum">대기 ${q}분</span>` : '') : '<span class="text-[11px] font-bold text-bad">휴무</span>'}
      </button>`; }).join('')}
    </div>

    ${member && pick ? `<section class="px-5 mt-8">
      <h2 class="text-[18px] font-extrabold">${esc(prof.name)}님을 위한 오늘 추천</h2>
      <button onclick="openDetail(${pick.menu.menu_id})" class="fu mt-3 w-full text-left card p-3 grid grid-cols-[96px_1fr] gap-3.5" style="--i:4">
        ${photo(pick.menu, 'w-24 h-24 rounded-row')}
        <span class="min-w-0 flex flex-col">
          <span class="flex flex-wrap gap-1">${pick.reasons.map(r => tag(r, 'blue')).join('')}</span>
          <span class="mt-1.5 text-[16px] font-bold leading-snug truncate">${pick.menu.name}</span>
          <span class="text-[12px] font-medium text-sub">${pick.menu.restaurantName}</span>
          <span class="mt-auto text-[15px] font-extrabold tnum">${won(pick.menu.price)} <span class="text-[12px] font-medium text-sub">${pick.menu.kcal}kcal</span></span>
        </span>
      </button>
    </section>` : ''}
    ${!member ? `<section class="mt-8">
      <div class="px-5 flex items-baseline justify-between"><h2 class="text-[18px] font-extrabold">오늘의 추천 메뉴</h2><span class="text-[12px] font-medium text-sub">오늘 인기와 대기 기준</span></div>
      <div class="mt-3 flex gap-3 overflow-x-auto no-scrollbar px-5 pb-1">
        ${picks.map((x, i) => homeCard(x.menu, pred, x.sold, i + 3)).join('')}
      </div>
      <div class="mx-5 mt-5 rounded-card bg-subtle p-4 flex items-center gap-3">
        <span class="w-10 h-10 rounded-row bg-white text-accent flex items-center justify-center shrink-0"><i data-lucide="user" class="w-5 h-5"></i></span>
        <p class="flex-1 text-[13px] font-medium leading-snug text-sub"><b class="block text-[14px] font-bold text-ink">로그인하면 나만의 추천</b>어제 먹은 메뉴와 남은 칼로리까지 보고 골라 드려요</p>
        <button onclick="doLogin()" class="h-10 px-4 rounded-full bg-accent active:bg-accent-press text-white text-[13px] font-bold shrink-0">로그인</button>
      </div>
    </section>` : ''}

    <section class="pt-8 pb-4">
      <div class="px-5 flex items-baseline justify-between"><h2 class="text-[18px] font-extrabold">지금 가장 빨리 나와요</h2><button onclick="state.sort='fast'; go('menu')" class="text-[14px] font-semibold text-sub flex items-center">전체보기<i data-lucide="chevron-right" class="w-4 h-4"></i></button></div>
      <p class="px-5 mt-1 text-[12px] font-medium text-sub">AI 시간대 예측과 식당별 주방 대기열을 합쳐 계산해요</p>
      <div class="mt-3 flex gap-3 overflow-x-auto no-scrollbar px-5 pb-1">
        ${fast.map((m, i) => homeCard(m, pred, 0, i + 3)).join('')}
      </div>
    </section>
  </div>`;
}

/* ---------- 식당 상세 ---------- */
function renderRestaurant() {
  const r = S.restaurantById(state.restaurantId) || S.getRestaurants()[0];
  const pred = S.predict();
  const list = menus().filter(m => m.restaurant === r.id).sort((a, b) => (b.orderable - a.orderable) || S.menuWait(a, pred) - S.menuWait(b, pred));
  const q = pred.queues[r.id] || 0;
  return `
  <div class="relative">
    ${restPhoto(r, 'w-full h-[220px]')}
    <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-slate-900/30 to-transparent"></div>
    <button onclick="go('home')" class="absolute left-3 w-11 h-11 rounded-full bg-white/90 shadow flex items-center justify-center" style="top: max(12px, env(safe-area-inset-top))" aria-label="홈으로"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
  </div>
  <div class="relative -mt-6 bg-white rounded-t-3xl px-5 pt-6">
    <p class="text-[13px] font-semibold text-blue-700">${r.category}</p>
    <h1 class="text-[26px] font-extrabold leading-tight">${r.name}</h1>
    <p class="mt-1 text-[14px] text-slate-600">${r.desc}</p>
    <div class="mt-4 grid grid-cols-3 gap-2 text-center">
      <div class="rounded-2xl bg-slate-50 py-3"><p class="text-[12px] text-slate-600">지금 받으면</p><p class="mt-0.5 text-[18px] font-extrabold tnum">${r.open ? '약 ' + S.restaurantWait(r.id, pred) + '분' : '-'}</p></div>
      <div class="rounded-2xl bg-slate-50 py-3"><p class="text-[12px] text-slate-600">주방 대기</p><p class="mt-0.5 text-[18px] font-extrabold tnum">${q ? q + '분 분량' : '없음'}</p></div>
      <div class="rounded-2xl bg-slate-50 py-3"><p class="text-[12px] text-slate-600">메뉴</p><p class="mt-0.5 text-[18px] font-extrabold tnum">${list.length}개</p></div>
    </div>
    ${r.open ? '' : '<p class="mt-4 rounded-2xl bg-rose-50 px-4 py-3 text-[14px] font-semibold text-rose-700">오늘은 이 식당이 쉬어요. 다른 식당 메뉴를 골라 주세요.</p>'}
    <ul class="mt-3">${list.map(m => rowHTML(m, pred)).join('')}</ul>
  </div>`;
}

function rowHTML(m, pred) {
  const reason = !m.restaurantOpen ? '오늘 쉬어요' : m.sold_out ? '품절' : '';
  return `<li class="py-4 border-b border-slate-100 last:border-0 flex gap-4 ${m.orderable ? '' : 'opacity-50'}">
    <button onclick="openDetail(${m.menu_id})" class="flex-1 min-w-0 text-left flex flex-col gap-1">
      <span class="flex gap-1">${tag(m.tag)}${reason ? tag(reason, 'red') : ''}</span>
      <span class="text-[17px] font-extrabold">${m.name}</span>
      <span class="text-[13px] text-slate-500 leading-snug">${m.desc}</span>
      <span class="text-[15px] font-extrabold tnum">${won(m.price)} <span class="text-[12px] font-medium text-slate-500">지금 ${S.menuWait(m, pred)}분 · ${m.kcal}kcal</span></span>
    </button>
    <span class="relative shrink-0">
      ${photo(m, 'w-24 h-24 rounded-xl')}
      ${m.orderable ? `<button onclick="quickAdd(${m.menu_id})" aria-label="${m.name} 담기" class="absolute -right-1 -bottom-1 w-11 h-11 flex items-center justify-center"><span class="w-9 h-9 rounded-full bg-white shadow-md flex items-center justify-center"><i data-lucide="plus" class="w-5 h-5"></i></span></button>` : ''}
    </span>
  </li>`;
}

/* ---------- 메뉴 탭 ---------- */
function renderMenu() {
  const pred = S.predict();
  const cats = ['전체', '밥', '면', '돈까스', '분식', '국물'];
  const sorts = [['fast', '빠른순'], ['price', '가격순'], ['protein', '고단백'], ['kcal', '칼로리 낮은순']];
  let list = menus().filter(m => (state.category === '전체' || m.category === state.category) && (!state.soupOnly || m.soup));
  const key = { fast: m => S.menuWait(m, pred), price: m => m.price, protein: m => -m.protein, kcal: m => m.kcal }[state.sort];
  list.sort((a, b) => (b.orderable - a.orderable) || key(a) - key(b));
  return `
  <header class="sticky top-0 z-10 bg-white/95 backdrop-blur pt-[max(10px,env(safe-area-inset-top))]">
    <h1 class="px-5 h-12 flex items-center text-[22px] font-extrabold">오늘의 메뉴</h1>
    <div class="flex gap-5 px-5 border-b border-slate-100 overflow-x-auto no-scrollbar">
      ${cats.map(c => `<button onclick="state.category='${c}'; render()" class="h-11 shrink-0 text-[16px] ${state.category === c ? 'font-extrabold text-slate-900 border-b-2 border-slate-900' : 'font-medium text-slate-500'}">${c}</button>`).join('')}
    </div>
    <div class="flex gap-2 px-5 py-3 overflow-x-auto no-scrollbar">
      ${sorts.map(([k, l]) => `<button onclick="state.sort='${k}'; render()" class="shrink-0 h-9 px-3.5 rounded-full text-[14px] font-semibold ${state.sort === k ? 'bg-slate-900 text-white' : 'border border-slate-200 text-slate-700'}">${l}</button>`).join('')}
      <button onclick="state.soupOnly=!state.soupOnly; render()" aria-pressed="${!!state.soupOnly}" class="shrink-0 h-9 px-3.5 rounded-full text-[14px] font-semibold ${state.soupOnly ? 'bg-blue-50 text-blue-800 ring-2 ring-blue-500' : 'border border-slate-200 text-slate-700'}">국물 있는 것만</button>
    </div>
  </header>
  <div class="px-5">
    <p class="pt-1 text-[13px] text-slate-500">${list.length}개 메뉴</p>
    ${list.length ? list.map(m => `<article class="py-4 border-b border-slate-100 last:border-0 ${m.orderable ? '' : 'opacity-50'}">
      <button onclick="openDetail(${m.menu_id})" class="relative block w-full text-left">
        ${photo(m, 'w-full h-[188px] rounded-2xl')}
        <span class="absolute top-3 left-3 h-7 px-2.5 rounded-full bg-white text-[12px] font-bold flex items-center">${m.tag}</span>
        <span class="absolute left-3 bottom-3 h-7 px-2.5 rounded-full bg-white text-[12px] font-bold flex items-center gap-1"><i data-lucide="timer" class="w-3.5 h-3.5 text-blue-500"></i>지금 주문 시 ${S.menuWait(m, pred)}분</span>
        ${m.orderable ? '' : `<span class="absolute inset-0 rounded-2xl bg-white/60 flex items-center justify-center"><span class="h-8 px-3 rounded-full bg-slate-900 text-white text-[13px] font-bold flex items-center">${m.restaurantOpen ? '오늘 준비한 수량이 다 나갔어요' : '오늘은 식당이 쉬어요'}</span></span>`}
      </button>
      <div class="mt-3 flex items-start gap-3">
        <button onclick="openDetail(${m.menu_id})" class="flex-1 text-left">
          <span class="block text-[12px] font-semibold text-blue-700">${m.restaurantName}</span>
          <span class="block text-[18px] font-extrabold">${m.name}</span>
          <span class="block mt-0.5 text-[13px] text-slate-500">${m.kcal}kcal · 단백질 ${m.protein}g · ${m.desc}</span>
        </button>
        <span class="text-right shrink-0"><span class="block text-[17px] font-extrabold tnum">${won(m.price)}</span>
          ${m.orderable ? `<button onclick="quickAdd(${m.menu_id})" class="mt-2 h-9 px-3 rounded-full bg-blue-50 text-blue-700 text-[13px] font-bold">담기</button>` : ''}</span>
      </div>
    </article>`).join('') : '<p class="py-16 text-center text-slate-500">이 분류에는 오늘 준비한 메뉴가 없어요.</p>'}
  </div>`;
}

/* ---------- AI 추천 탭 ---------- */
function engineLabel() {
  if (state.server.ready) { return 'AI 연결됨'; }
  const c = window.MJCAI.getConfig();
  if (window.MJCAI.hasLocalKey()) { return c.provider === 'baze' ? 'BAZE · ' + (c.bazeModel || '모델 미지정') : 'Claude'; }
  return state.server.reason === 'checking' ? '확인 중' : '기본 추천';
}
function renderAI() {
  const intake = S.todayIntake();
  const pred = S.predict();
  const msgs = state.chat.length ? state.chat.map(chatHTML).join('') : `
    <div class="rise rounded-3xl bg-blue-50 p-5">
      <p class="text-[17px] font-extrabold text-blue-900">무엇이든 말로 물어보세요</p>
      <p class="mt-1.5 text-[14px] leading-relaxed text-blue-900/80">${S.isMember() ? `5개 식당 45개 메뉴, 식당별 주방 대기, ${esc(S.getProfile().name)}님의 남은 칼로리(${intake.remain.toLocaleString('ko-KR')}kcal)와 최근 주문을 함께 보고 골라 드려요.` : '5개 식당 45개 메뉴와 식당별 주방 대기를 보고 골라 드려요. 로그인하면 남은 칼로리와 최근 주문까지 반영해요.'} 시간 안에 받기 어려우면 예약도 권해 드려요.</p>
      <p class="mt-3 text-[12px] text-blue-800">지금 대기 ${pred.currentWait}분 · ${pred.recTime ? pred.recTime + '에 오면 ' + pred.recWait + '분' : '바로 주문 가능'}</p>
    </div>`;
  return `
  <header class="sticky top-0 z-10 bg-white/95 backdrop-blur pt-[max(10px,env(safe-area-inset-top))] border-b border-slate-100">
    <div class="h-14 px-5 flex items-center gap-2.5">
      <span class="w-9 h-9 rounded-xl bg-blue-500 text-white flex items-center justify-center"><i data-lucide="sparkles" class="w-5 h-5"></i></span>
      <div class="leading-tight"><h1 class="text-[17px] font-extrabold">AI 메뉴 추천</h1><p class="text-[12px] text-slate-500">말로 찾고, 바로 주문까지</p></div>
      <span class="ml-auto h-7 px-2.5 rounded-full bg-slate-100 text-[12px] font-bold text-slate-600 flex items-center">${engineLabel()}</span>
    </div>
  </header>
  <div id="chatList" class="px-4 pt-4 pb-44 space-y-3">${msgs}</div>
  <div class="fixed inset-x-0 z-20" style="bottom: calc(68px + env(safe-area-inset-bottom, 0px));">
    <div class="max-w-[430px] mx-auto bg-white border-t border-slate-100 px-3 pt-2.5 pb-3">
      <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2.5">${CHIPS.map(c => `<button onclick="sendChat('${c}')" class="shrink-0 h-9 px-3.5 rounded-full border border-slate-200 text-[13px] font-semibold text-slate-700">${c}</button>`).join('')}</div>
      <form onsubmit="event.preventDefault(); submitChat();" class="flex gap-2">
        <input id="chatInput" autocomplete="off" maxlength="300" placeholder="예: 10분 안에 나오는 순한 국물 메뉴" class="flex-1 min-w-0 h-12 rounded-2xl bg-slate-100 px-4 text-[15px] outline-none focus:bg-white focus:ring-2 focus:ring-blue-500">
        <button class="w-12 h-12 rounded-2xl bg-blue-500 text-white flex items-center justify-center" aria-label="보내기" ${state.chatBusy ? 'disabled' : ''}><i data-lucide="send" class="w-5 h-5"></i></button>
      </form>
    </div>
  </div>`;
}

function chatHTML(msg) {
  if (msg.role === 'user') {
    return `<div class="flex justify-end rise"><p class="max-w-[80%] rounded-[20px] rounded-br-md bg-blue-700 text-white px-4 py-2.5 text-[15px] leading-relaxed">${esc(msg.text)}</p></div>`;
  }
  if (msg.loading) {
    return `<div class="flex gap-2 rise"><span class="w-8 h-8 rounded-xl bg-blue-500 text-white flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-4 h-4"></i></span>

  }
  const r = msg.result;
  const pred = r.pred || S.predict();
  if (!r.uid) { r.uid = ++aiUidSeq; }
  const items = (r.action && Array.isArray(r.action.items)) ? r.action.items.filter(it => menu(it.menu_id)) : [];
  const multi = items.length >= 2;
  const qtyOf = id => { const it = items.find(x => x.menu_id === id); return it ? it.qty : 0; };
  const rows = (r.menus || []).map(m => `<div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-2.5">
      ${photo(m, 'w-14 h-14 rounded-xl shrink-0')}
      <button onclick="openDetail(${m.menu_id})" class="flex-1 min-w-0 text-left"><span class="block text-[15px] font-bold truncate">${m.name}${multi && qtyOf(m.menu_id) ? ` <span class="text-blue-700">${qtyOf(m.menu_id)}개</span>` : ''}</span>
        <span class="block text-[12px] text-slate-600">지금 ${S.menuWait(m, pred)}분 · ${m.kcal}kcal · ${won(m.price)}</span></button>
      <button onclick="quickAdd(${m.menu_id})" class="w-11 h-11 flex items-center justify-center" aria-label="${m.name} 담기"><span class="w-9 h-9 rounded-full bg-blue-500 text-white flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4"></i></span></button>
    </div>`).join('');
  const top = (r.menus || [])[0];
  let action = '';
  const itemsStr = items.map(it => it.menu_id + ':' + it.qty).join(',');
  /* 2개 이상: 합계는 AI 문장이 아니라 앱이 계산 (가격 합, 가장 늦게 나오는 메뉴 기준 시간) */
  const orderable = items.filter(it => menu(it.menu_id).orderable);
  const sumPrice = orderable.reduce((t, it) => t + menu(it.menu_id).price * it.qty, 0);
  const sumCount = orderable.reduce((t, it) => t + it.qty, 0);
  const maxWait = orderable.reduce((t, it) => Math.max(t, S.menuWait(menu(it.menu_id), pred)), 0);
  const summary = multi && orderable.length ? `<p class="mt-3 text-[13px] text-slate-600">${sumCount}개 · 합계 <b class="text-slate-900">${won(sumPrice)}</b> · 가장 늦게 나오는 메뉴 기준 약 ${maxWait}분</p>` : '';
  const added = !!aiAdded[r.uid];
  if (top && r.action && r.action.type === 'reserve' && pred.recTime) {
    if (multi) {
      action = `${summary}<button onclick="aiReserveAll('${itemsStr}', ${r.uid})" class="mt-3 w-full h-12 rounded-2xl bg-blue-700 text-white text-[15px] font-bold flex items-center justify-center gap-1.5"><i data-lucide="calendar-clock" class="w-[18px] h-[18px]"></i>모두 ${pred.recTime} 예약으로 담기</button>`;
    } else {
      action = `<button onclick="aiReserve(${(r.action.menu_id || top.menu_id)})" class="mt-3 w-full h-12 rounded-2xl bg-blue-700 text-white text-[15px] font-bold flex items-center justify-center gap-1.5"><i data-lucide="calendar-clock" class="w-[18px] h-[18px]"></i>${menu(r.action.menu_id || top.menu_id).short} ${pred.recTime} 예약으로 담기</button>`;
    }
  } else if (top && r.action && r.action.type === 'add') {
    if (multi) {
      action = `${summary}
        <button id="aiAddAll${r.uid}" onclick="aiAddAll('${itemsStr}', ${r.uid})" ${added ? 'disabled' : ''} class="mt-3 w-full h-12 rounded-2xl ${added ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-800'} text-[15px] font-bold flex items-center justify-center gap-1.5"><i data-lucide="${added ? 'check' : 'shopping-bag'}" class="w-[18px] h-[18px]"></i>${added ? '장바구니에 담았어요' : '모두 담기'}</button>
        <button onclick="aiOrderNow('${itemsStr}', ${r.uid})" class="mt-2 w-full h-12 rounded-2xl bg-blue-700 text-white text-[15px] font-bold">바로 주문하기</button>`;
    } else {
      action = `<button onclick="aiAdd(${(r.action.menu_id || top.menu_id)})" class="mt-3 w-full h-12 rounded-2xl bg-blue-700 text-white text-[15px] font-bold">${menu(r.action.menu_id || top.menu_id).short} 바로 담기</button>`;
    }
  }
  const engine = r.engine === 'llm' ? `${esc(r.model || 'AI')} 모델이 답했어요${r.via === 'server' ? ' (서버 연결)' : ''}` : '규칙 기반으로 답했어요';
  return `<div class="flex gap-2 rise"><span class="w-8 h-8 rounded-xl bg-blue-500 text-white flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-4 h-4"></i></span>
    <div class="flex-1 min-w-0 rounded-[20px] rounded-tl-md bg-white border border-slate-100 shadow-sm p-4">
      <p class="text-[15px] leading-relaxed">${esc(r.reply)}</p>
      ${rows ? `<div class="mt-3 space-y-2">${rows}</div>` : ''}
      ${action}
      <details class="mt-3 rounded-xl bg-slate-50">
        <summary class="px-3 py-2 text-[12px] font-semibold text-slate-600 flex items-center gap-1"><i data-lucide="database" class="w-3.5 h-3.5"></i>AI가 만든 SQL 보기</summary>
        <pre class="px-3 pb-3 text-[11px] leading-relaxed text-slate-700 whitespace-pre-wrap break-all">${esc(r.sql)}</pre>
      </details>
      <p class="mt-2 text-[11px] text-slate-500">${engine}${r.error ? ' · ' + esc(r.error) : ''}</p>
    </div></div>`;
}

function submitChat() {
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if (!q || state.chatBusy) { return; }
  input.value = '';
  sendChat(q);
}
async function sendChat(q) {
  if (state.chatBusy) { return; }
  if (state.tab !== 'ai') { state.tab = 'ai'; }
  const history = state.chat.filter(m => !m.loading).slice(-4).map(m => m.role === 'user' ? { role: 'user', content: m.text } : { role: 'assistant', content: m.result ? m.result.reply : '' });
  state.chat.push({ role: 'user', text: q });
  state.chat.push({ role: 'bot', loading: true });
  state.chatBusy = true;
  render(); scrollChat();
  let result;
  try { result = await window.MJCAI.ask(q, history); }
  catch (e) { result = { engine: 'rule', sql: '', reply: '지금은 추천을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 물어봐 주세요.', menus: [], action: { type: 'none' }, error: e.message }; }
  state.chat.pop();
  state.chat.push({ role: 'bot', result });
  S.bumpAIStats(result.engine);
  state.chatBusy = false;
  if (state.tab === 'ai') { render(); scrollChat(); }
}
function scrollChat() { setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50); }
function markAI(id) { const l = state.cart.find(x => x.id === Number(id)); if (l) { l.fromAI = true; } }
const aiAdded = {}; let aiUidSeq = 0;
function aiParseItems(str) { return String(str).split(',').map(p => { const [id, q] = p.split(':'); return { id: Number(id), qty: Math.max(1, Math.min(9, Number(q) || 1)) }; }); }
/* 여러 메뉴를 한 번에 담기. 같은 답변에서 두 번 담기지 않도록 uid로 기억. 담은 개수를 돌려줌(0이면 실패) */
function aiAddAll(str, uid, silent) {
  if (aiAdded[uid]) { if (!silent) { toast('이미 담았어요', 'info'); } return -1; }
  const list = aiParseItems(str).filter(it => { const m = menu(it.id); return m && m.orderable; });
  if (!list.length) { toast('지금 담을 수 있는 메뉴가 없어요', 'info'); return 0; }
  list.forEach(it => { addToCart(it.id, it.qty, { rice: '보통', sauce: false }, ''); markAI(it.id); });
  aiAdded[uid] = true;
  renderCartBar();
  const btn = document.getElementById('aiAddAll' + uid);
  if (btn) { btn.disabled = true; btn.className = btn.className.replace('bg-blue-50 text-blue-800', 'bg-slate-100 text-slate-500'); btn.innerHTML = '<i data-lucide="check" class="w-[18px] h-[18px]"></i>장바구니에 담았어요'; icons(); }
  const n = list.reduce((t, it) => t + it.qty, 0);
  const skipped = aiParseItems(str).length - list.length;
  if (!silent) { toast(list.length + '가지 메뉴, ' + n + '개를 담았어요' + (skipped ? ' (품절·휴무 ' + skipped + '개 제외)' : ''), 'check'); }
  return n;
}
/* 모두 담고 바로 결제 창 열기 (이미 담았다면 다시 담지 않고 결제 창만 열기) */
function aiOrderNow(str, uid) {
  const r = aiAddAll(str, uid, true);
  if (r === 0) { return; }
  state.pickup = 'now'; renderCartBar(); openCart();
}
function aiReserveAll(str, uid) {
  const r = aiAddAll(str, uid, true);
  if (r === 0) { return; }
  state.pickup = 'reserve'; renderCartBar(); openCart(); toast('예약 주문으로 담았어요', 'calendar-clock');
}
function aiReserve(id) { addToCart(id, 1, { rice: '보통', sauce: false }, ''); markAI(id); state.pickup = 'reserve'; renderCartBar(); openCart(); toast('예약 주문으로 담았어요', 'calendar-clock'); }
function aiAdd(id) { addToCart(id, 1, { rice: '보통', sauce: false }, ''); markAI(id); renderCartBar(); toast(menu(id).name + ' 담았어요'); }

function saveAI() {
  const c = window.MJCAI.getConfig();
  const key = (document.getElementById('keyInput').value || '').trim();
  if (c.provider === 'baze') {
    const model = (document.getElementById('modelInput').value || '').trim();

    window.MJCAI.saveConfig({ bazeModel: model, bazeBase: base === window.MJCAI.BAZE_BASE_DEFAULT ? '' : base });

/* ---------- 장바구니 ---------- */
function lineKey(id, opts) { return id + '|' + opts.rice + '|' + (opts.sauce ? 1 : 0); }
function addToCart(id, qty, opts) {
  const m = menu(id);
  if (!m || !m.orderable) { toast(m && !m.restaurantOpen ? '오늘은 이 식당이 쉬어요' : '품절된 메뉴는 담을 수 없어요', 'info'); return; }
  opts = opts || { rice: '보통', sauce: false };
  const key = lineKey(id, opts);
  const line = state.cart.find(l => l.key === key);
  if (line) { line.qty += qty; } else { state.cart.push({ key, id: Number(id), qty, opts }); }
  renderCartBar();
}
function quickAdd(id) { const m = menu(id); addToCart(id, 1); if (m && m.orderable) { toast(m.name + ' 담았어요'); } }
function linePrice(l) { const m = menu(l.id); const extra = m.ingredients && m.ingredients.rice && l.opts.rice === '곱빼기' ? 500 : 0; return (m.price + extra) * l.qty; }
function cartTotal() { return state.cart.reduce((s, l) => s + linePrice(l), 0); }
function cartCount() { return state.cart.reduce((s, l) => s + l.qty, 0); }
function renderCartBar() {
  const n = cartCount();
  const bar = document.getElementById('cartBar');
  bar.classList.toggle('show', n > 0 && state.tab !== 'ai');
  const fab = document.getElementById('aiCartFab');
  if (fab) { fab.classList.toggle('hidden', !(n > 0 && state.tab === 'ai')); document.getElementById('aiCartFabCount').textContent = n; }
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartTotal').textContent = won(cartTotal());
  const p = S.predict();
  document.getElementById('cartSub').textContent = state.pickup === 'reserve' && p.recTime ? p.recTime + ' 예약 · 대기 약 ' + p.recWait + '분' : '지금 바로 받기 · 대기 약 ' + p.currentWait + '분';
}
function chooseReserve() {
  state.pickup = 'reserve';
  renderCartBar();
  if (cartCount()) { openCart(); } else { go('menu'); toast(S.predict().recTime + ' 예약으로 설정했어요. 메뉴를 담아 주세요', 'calendar-clock'); }
}
function openCart() { if (!cartCount()) { return; } renderCart(); openLayer('cart'); }
function closeCart() { closeLayer('cart'); }
function changeLine(key, d) {
  const l = state.cart.find(x => x.key === key);
  if (!l) { return; }
  l.qty += d;
  if (l.qty <= 0) { state.cart = state.cart.filter(x => x.key !== key); }
  renderCartBar();
  if (!cartCount()) { closeCart(); } else { renderCart(); }
}
function renderCart() {
  const p = S.predict();
  const o = S.openState();
  const canReserve = !!p.recTime;
  if (state.pickup === 'reserve' && !canReserve) { state.pickup = 'now'; }
  const total = cartTotal();
  document.getElementById('cartBody').innerHTML = `
    <div class="pt-3 flex justify-center"><span class="w-10 h-1.5 rounded-full bg-slate-200"></span></div>
    <div class="px-5 pt-2 flex items-center justify-between"><h2 class="text-[22px] font-extrabold">주문 확인</h2><button onclick="closeCart()" class="w-10 h-10 flex items-center justify-center" aria-label="닫기"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div class="flex-1 overflow-y-auto px-5 pb-4">
      <p class="mt-3 text-[14px] font-semibold text-slate-600">받는 시간</p>
      <div class="mt-2 grid grid-cols-2 gap-2" role="radiogroup">
        <button role="radio" aria-checked="${state.pickup === 'now'}" onclick="state.pickup='now'; renderCart(); renderCartBar()" class="text-left rounded-2xl p-4 border-2 ${state.pickup === 'now' ? 'border-blue-500 bg-blue-50' : 'border-slate-100'}">
          <span class="block text-[15px] font-extrabold ${state.pickup === 'now' ? 'text-blue-800' : ''}">지금 바로 받기</span><span class="block text-[13px] ${state.pickup === 'now' ? 'text-blue-800' : 'text-slate-500'}">대기 약 ${p.currentWait}분</span></button>
        <button role="radio" aria-checked="${state.pickup === 'reserve'}" ${canReserve ? '' : 'disabled'} onclick="state.pickup='reserve'; renderCart(); renderCartBar()" class="relative text-left rounded-2xl p-4 border-2 ${state.pickup === 'reserve' ? 'border-blue-500 bg-blue-50' : 'border-slate-100'} ${canReserve ? '' : 'opacity-40'}">
          <span class="absolute top-3 right-3 h-5 px-1.5 rounded-md bg-blue-700 text-white text-[11px] font-bold flex items-center">AI 추천</span>
          <span class="block text-[15px] font-extrabold ${state.pickup === 'reserve' ? 'text-blue-800' : ''}">${p.recTime || '-'} 예약</span><span class="block text-[13px] ${state.pickup === 'reserve' ? 'text-blue-800' : 'text-slate-500'}">대기 약 ${p.recWait || '-'}분</span></button>
      </div>
      <p class="mt-5 text-[14px] font-semibold text-slate-600">담은 메뉴</p>
      <ul>${state.cart.map(l => { const m = menu(l.id); return `<li class="py-3 flex items-center gap-3 border-b border-slate-100 last:border-0">
        ${photo(m, 'w-14 h-14 rounded-xl shrink-0')}
        <div class="flex-1 min-w-0"><p class="text-[15px] font-bold truncate">${m.name}</p><p class="text-[12px] text-slate-500 truncate">${m.ingredients && m.ingredients.rice ? '밥 ' + l.opts.rice : ''}${l.opts.sauce ? ' · 소스 따로' : ''}</p><p class="text-[14px] font-bold tnum">${won(linePrice(l))}</p></div>
        <div class="flex items-center h-11 rounded-full border border-slate-200"><button onclick="changeLine('${l.key}',-1)" class="w-10 h-10 flex items-center justify-center" aria-label="빼기"><i data-lucide="minus" class="w-4 h-4"></i></button><span class="w-5 text-center font-bold tnum">${l.qty}</span><button onclick="changeLine('${l.key}',1)" class="w-10 h-10 flex items-center justify-center" aria-label="더하기"><i data-lucide="plus" class="w-4 h-4"></i></button></div>
      </li>`; }).join('')}</ul>
      <p class="mt-5 text-[14px] font-semibold text-slate-600">결제 수단</p>
      <div class="mt-2 grid grid-cols-2 gap-2">${PAY.map(x => `<button onclick="state.pay='${x.id}'; renderCart()" class="h-[52px] rounded-2xl border-2 px-3 flex items-center gap-2 text-[15px] font-semibold ${state.pay === x.id ? 'border-blue-500 bg-blue-50 text-blue-800' : 'border-slate-100'}"><i data-lucide="${x.icon}" class="w-5 h-5"></i>${x.label}</button>`).join('')}</div>
      <p class="mt-4 text-[12px] text-slate-500">경진대회 시연용 모의 결제예요. 실제로 돈이 나가지 않아요.</p>
    </div>
    <div class="px-5 pt-3 border-t border-slate-100" style="padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));">
      ${o.open ? `<button id="payBtn" onclick="pay()" class="w-full h-14 rounded-2xl bg-blue-500 text-white text-[19px] font-extrabold flex items-center justify-center gap-2">${won(total)} 결제하기</button>`
        : `<button disabled class="w-full h-14 rounded-2xl bg-slate-200 text-slate-500 text-[17px] font-bold">${o.label}${o.next ? ' · ' + o.next + '부터 주문할 수 있어요' : ''}</button>`}
    </div>`;
  icons();
}
async function pay() {
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>결제 승인 중';
  icons();
  await new Promise(r => setTimeout(r, 1100));
  const p = S.predict();
  const orders = S.getOrders();
  const reserve = state.pickup === 'reserve' && p.recTime;
  const items = state.cart.map(l => { const m = menu(l.id); const unit = linePrice(l) / l.qty; return { menu_id: m.menu_id, menu_name: m.name, restaurant: m.restaurant, restaurant_name: m.restaurantName, quantity: l.qty, unit_price: unit, total_price: unit * l.qty }; });
  const maxCook = Math.max(...state.cart.map(l => menu(l.id).cook));
  const order = {
    order_number: S.issueOrderNumber(orders),
    items, total_price: items.reduce((s, i) => s + i.total_price, 0),
    order_status: 'WAITING', order_time: S.demoNow(), channel: '모바일', customer: 'me', member: S.isMember(),
    payment_method: PAY.find(x => x.id === state.pay).label,
    pickup_type: reserve ? 'RESERVED' : 'NOW', pickup_time: reserve ? p.recTime : null,
    eta_minutes: reserve ? p.recWait : Math.max(maxCook, p.currentWait - 5 + maxCook),
    ai_reserved: !!reserve, ai_saved_minutes: reserve ? Math.max(0, p.currentWait - p.recWait) : 0,
    via_ai: state.cart.some(l => l.fromAI),
    pos_ingested: true
  };
  orders.push(order);
  S.saveOrders(orders);
  state.knownStatus[order.order_number] = 'WAITING';
  state.cart = []; state.pickup = 'now';
  closeCart(); renderCartBar();
  showDone(order);
}
function showDone(o) {
  const reserve = o.pickup_type === 'RESERVED';
  document.getElementById('doneCard').innerHTML = `
    <div class="flex justify-center pop"><svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30" fill="#E8F3FF"></circle><circle class="ring-draw" cx="40" cy="40" r="30" fill="none" stroke="#3182F6" stroke-width="5" stroke-linecap="round" transform="rotate(-90 40 40)"></circle><path class="tick-draw" d="M28 41 L36.5 49.5 L53 32.5" fill="none" stroke="#3182F6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    <p class="mt-4 text-center text-[14px] font-semibold text-slate-500">주문번호</p>
    <h2 class="text-center text-[34px] font-extrabold tnum">${S.orderNo(o.order_number)}</h2>
    <p class="text-center text-[17px] font-bold">접수 완료</p>
    <p class="mt-1 text-center text-[14px] text-slate-600">${reserve ? o.pickup_time + '에 맞춰 조리를 시작할게요' : '약 ' + o.eta_minutes + '분 뒤 번호로 불러 드릴게요'}</p>
    <dl class="mt-5 rounded-2xl bg-slate-50 p-4 space-y-2 text-[14px]">
      <div class="flex justify-between gap-3"><dt class="text-slate-600 shrink-0">메뉴</dt><dd class="text-right font-medium">${o.items.map(i => i.menu_name + ' ' + i.quantity + '개').join(', ')}</dd></div>
      <div class="flex justify-between"><dt class="text-slate-600">결제</dt><dd class="font-medium">${o.payment_method} ${won(o.total_price)}</dd></div>
      <div class="flex justify-between"><dt class="text-slate-600">칼로리 기록</dt><dd class="font-medium">마이에 자동 기록했어요</dd></div>
    </dl>
    <button onclick="closeDone(); go('orders')" class="mt-5 w-full h-14 rounded-2xl bg-blue-500 text-white text-[19px] font-extrabold">주문 현황 보기</button>`;
  openLayer('done');
}
function closeDone() { closeLayer('done'); }

/* ---------- 레이어 ---------- */
function openLayer(name) {
  if (name === 'done') { document.getElementById('doneLayer').classList.add('open'); return; }
  document.getElementById(name + 'Backdrop').classList.add('open');
  document.getElementById(name + 'Sheet').classList.add('open');
  icons();
}
function closeLayer(name) {
  if (name === 'done') { document.getElementById('doneLayer').classList.remove('open'); return; }
  document.getElementById(name + 'Backdrop').classList.remove('open');
  document.getElementById(name + 'Sheet').classList.remove('open');
}

/* ---------- 렌더 & 실시간 갱신 ---------- */
function render() {
  const v = document.getElementById('view');
  v.dataset.anim = v.dataset.tab !== state.tab ? '1' : ''; v.dataset.tab = state.tab;
  v.innerHTML = { home: renderHome, restaurant: renderRestaurant, menu: renderMenu, ai: renderAI, orders: renderOrders, my: renderMy }[state.tab]();
  renderTabbar();
  renderCartBar();
  icons();
}
function snapshot() {
  return [S.KEYS.orders, S.KEYS.soldOut, S.KEYS.menus, S.KEYS.hours, S.KEYS.aiConfig, S.KEYS.demoOffset, S.KEYS.restaurants, S.KEYS.session].map(k => S.readRaw(k)).join('§');
}
function checkReady() {
  S.myOrders().forEach(o => {
    const prev = state.knownStatus[o.order_number];
    if (prev && prev !== o.order_status && o.order_status === 'READY') {
      toast(S.orderNo(o.order_number) + ' 나왔어요! 메뉴가 준비됐어요. 수령해 주세요', 'bell-ring');
      if (navigator.vibrate) { navigator.vibrate([120, 60, 120]); }
    }
    state.knownStatus[o.order_number] = o.order_status;
  });
}
function refresh() {
  const raw = snapshot();
  if (raw === state.lastRaw) { return; }
  state.lastRaw = raw;
  checkReady();
  const typing = document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
  if (!typing && state.tab !== 'ai') { render(); } else { renderTabbar(); renderCartBar(); icons(); }
  if (document.getElementById('cartSheet').classList.contains('open')) { renderCart(); }
}

async function checkServer() {
  state.server = await window.MJCAI.serverStatus();
  if (state.tab === 'my' || state.tab === 'ai') { render(); }
}

function init() {
  checkServer();
  S.ensureSeed();
  S.myOrders().forEach(o => { state.knownStatus[o.order_number] = o.order_status; });
  state.lastRaw = snapshot();
  render();
  setInterval(refresh, 1500);
  window.addEventListener('storage', refresh);
}
document.addEventListener('DOMContentLoaded', () => { (window.dbReady || Promise.resolve()).then(init); });
</script>
</body>
</html>
